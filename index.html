            { id: 9, name: "Julom, El Quinwell", ward: "MALE SURGERY WARD", dx: "Stab Wound Abdomen", surgery: "Exploratory Laparotomy", monitor: "VSQ4 | JP Drain | NGT | Urine Output", cod: "Dry with Betadine", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0109", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },
            { id: 10, name: "Montano, Luzviminda (57/F)", ward: "ENT / OPHTHA WARD", dx: "Sigmoid Adenocarcinoma Stage 3, Colovesical Fistula", surgery: "Colostomy", monitor: "VSQ4", cod: "Dressing done at 7:00 AM; JP drain and colostomy drain per shift", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0110", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },

            { id: 12, name: "Cabangbang, Ofelia (66/F)", ward: "ISOLATION SURGERY WARD", dx: "Diabetic Foot (R)", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution OD", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0112", isDiabetic: true, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },
            { id: 13, name: "Eribal, Zandro Ferrer (54/M)", ward: "ISOLATION SURGERY WARD", dx: "Non-healing Wound (L) Thigh, T2 DM", surgery: "", monitor: "VSQ2 | CBG: Q1", cod: "Wet-to-dry (Ask NOD).", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0113", isDiabetic: true, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },
            { id: 14, name: "Quitain, Rodel Badrina (52/M)", ward: "ISOLATION SURGERY WARD", dx: "Non-healing Wound (L) Heel (Note: presence of maggots)", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Third's Solution OD", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0114", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },
            { id: 15, name: "Manlangit, Allan (44/M)", ward: "ISOLATION SURGERY WARD", dx: "Sepsis sec to Decubitus Ulcer Grade IV", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0115", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },
            { id: 16, name: "Caballero, Daniel Seth", ward: "SURGICAL SUITE ROOM", dx: "Fracture, Middle 3rd Humerus (R)", surgery: "", monitor: "VSQ4", cod: "", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0116", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },
            { id: 17, name: "Buenviaje, Nilda Cajipo (69/F)", ward: "CICU", dx: "Diabetic Foot (R)", surgery: "", monitor: "VSQ1 | CBG: TID", cod: "Wet-to-dry with Dakin's Solution OD", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0117", isDiabetic: true, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },
            { id: 18, name: "Lumandez, Pablito Jr.", ward: "CICU", dx: "Diabetic Foot / Wound", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution OD. (Note: Should be done during daytime).", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0118", isDiabetic: true, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },
            { id: 19, name: "Zuniga", ward: "IM WARD", dx: "Sepsis sec to Sacral Ulcers", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution OD", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0119", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },
            { id: 20, name: "Atanante, Jennifer", ward: "IM WARD", dx: "Cellulitis / Wound Care", surgery: "", monitor: "VSQ4", cod: "Hansol Chlorhexidine Gluconate 4% Topical Solution + Bactromed Mupirocin Ointment (2% w/w). (If patient denies, leave open).", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0120", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },
            { id: 21, name: "Garrido", ward: "IM WARD", dx: "Sacral Ulcers", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution OD", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0121", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },
            { id: 22, name: "Ellaso, Eric (56/M)", ward: "IM WARD", dx: "Wound Care", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution OD. (Note: Put 1 wet gauze inside the wound).", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0122", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false },
            { id: 23, name: "Castillejos, Draven Mell (2/M)", ward: "PEDIATRIC WARD", dx: "Perianal Cellulitis/Abscess, T/C Sepsis, T/C ALL", surgery: "", monitor: "VSQ4", cod: "Apply Flammazine and wound care BID", location: "In Ward", watcherName: "Parent / Guardian", watcherPhone: "0917-550-0123", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, picsDone: false }
        ];

        const DOCTORS = [
            { name: "Dr. Glenn Camaymayan", pin: "1101", title: "Surgery Resident / Consultant" },
            { name: "Dr. Ruby T.", pin: "1102", title: "Surgery Resident / Consultant" },
            { name: "Dr. Osorio", pin: "1103", title: "Surgery Resident / Consultant" }
        ];

        function App() {
            const [patients, setPatients] = useState(() => {
                const saved = localStorage.getItem("pcgh_patients_v4");
                return saved ? JSON.parse(saved) : INITIAL_PATIENTS;
            });
            const [userRole, setUserRole] = useState("clerk"); // clerk | doctor | developer
            const [activeDoctor, setActiveDoctor] = useState(null);
            const [clerkName, setClerkName] = useState("Ethan (Group Leader)");
            const [notifications, setNotifications] = useState([]);
            const [showVerifyModal, setShowVerifyModal] = useState(false);
            const [selectedDoctorName, setSelectedDoctorName] = useState(DOCTORS[0].name);
            const [pinInput, setPinInput] = useState("");
            const [showSops, setShowSops] = useState(false);
            const [showDevModal, setShowDevModal] = useState(false);
            const [devPasscode, setDevPasscode] = useState("");

            useEffect(() => {
                localStorage.setItem("pcgh_patients_v4", JSON.stringify(patients));
            }, [patients]);

            const handleVerifyDoctor = (e) => {
                e.preventDefault();
                const doc = DOCTORS.find(d => d.name === selectedDoctorName);
                if (doc && doc.pin === pinInput) {
                    setActiveDoctor(doc.name);
                    setUserRole("doctor");
                    setShowVerifyModal(false);
                    setPinInput("");
                    addNotification(`🔓 ${doc.name} logged in as Verified Doctor.`);
                } else {
                    alert("Incorrect Doctor PIN.");
                }
            };

            const addNotification = (text) => {
                setNotifications(prev => [{ id: Date.now(), text, time: new Date().toLocaleTimeString() }, ...prev.slice(0, 9)]);
            };

            const updatePatientField = (id, field, value) => {
                setPatients(prev => prev.map(p => {
                    if (p.id === id) {
                        const updated = { ...p, [field]: value };
                        addNotification(`📝 ${userRole === 'doctor' ? activeDoctor : clerkName} updated ${p.name}'s ${field.toUpperCase()}.`);
                        return updated;
                    }
                    return p;
                }));
            };

            const updateFieldWithPrompt = (id, field, currentValue, fieldName) => {
                const newValue = prompt(`Doctor's Override - Enter new ${fieldName}:`, currentValue);
                if (newValue !== null && newValue !== currentValue) {
                    updatePatientField(id, field, newValue);
                }
            };

            const handleImageUpload = (id) => {
                // Simulating a native file upload picker for static frontend
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.capture = 'environment';
                input.onchange = () => {
                    markActionDone(id, 'picsDone');
                };
                input.click();
            };

            const markActionDone = (id, actionType) => {
                setPatients(prev => prev.map(p => {
                    if (p.id === id) {
                        const isDone = !p[actionType];
                        const actionName = actionType === 'picsDone' ? 'uploaded a wound image' : 'completed Wound Care / COD';
                        const icon = actionType === 'picsDone' ? '📸' : '🩹';
                        
                        if (isDone) {
                            addNotification(`${icon} ${userRole === 'doctor' ? activeDoctor : clerkName} ${actionName} for ${p.name}.`);
                        }
                        
                        return { ...p, [actionType]: isDone };
                    }
                    return p;
                }));
            };

            const toggleLocation = (id, newLoc) => {
                setPatients(prev => prev.map(p => {
                    if (p.id === id) {
                        addNotification(`📍 ${p.name} moved to [${newLoc}] by ${userRole === 'doctor' ? activeDoctor : clerkName}.`);
                        return { ...p, location: newLoc };
                    }
                    return p;
                }));
            };

            const setAmputation = (id, type) => {
                setPatients(prev => prev.map(p => {
                    if (p.id === id) {
                        let codText = p.cod;
                        if (type) {
                            codText = "Clean closed surgical stump with Povidone-Iodine (Betadine), pat dry, and wrap with dry sterile gauze & elastic bandage OD.";
                        }
                        addNotification(`🔪 ${p.name} set to ${type || 'No Amputation'}.`);
                        return { 
                            ...p, 
                            isPostAmputation: !!type, 
                            amputationType: type, 
                            surgery: type ? `${type} Amputation` : p.surgery,
                            cod: codText
                        };
                    }
                    return p;
                }));
            };

            const downloadHtmlFile = () => {
                const htmlContent = document.documentElement.outerHTML;
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'index.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alert("📥 Downloaded updated 'index.html'! Upload this to GitHub to auto-deploy to Vercel.");
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 pb-16">
                    {/* Top Header */}
                    <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-md">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-emerald-600 p-2.5 rounded-xl shadow-lg">
                                    <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="text-lg font-bold tracking-tight text-white">PCGH Surgery Ward Live Tracker</h1>
                                        <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${userRole === 'doctor' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-blue-500/20 text-blue-400 border border-blue-500/30'}`}>
                                            {userRole === 'doctor' ? `👨‍⚕️ Doctor's Mode (${activeDoctor})` : `📋 Clerk Mode (${clerkName})`}
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400">Pasay City General Hospital • Real-Time Ward Coordination</p>
                                </div>
                            </div>

                            {/* Action Buttons */}
                            <div className="flex flex-wrap items-center gap-2">
                                {userRole === 'doctor' ? (
                                    <button onClick={() => { setUserRole('clerk'); setActiveDoctor(null); }} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2 rounded-lg text-xs font-medium transition border border-slate-700">
                                        Switch to Clerk Mode
                                    </button>
                                ) : (
                                    <button onClick={() => setShowVerifyModal(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5">
                                        🔒 Verify Doctor Login
                                    </button>
                                )}

                                <button onClick={() => setShowSops(!showSops)} className="bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-600/40 px-3.5 py-2 rounded-lg text-xs font-medium transition">
                                    📋 SOPs & Wound Rules
                                </button>

                                <button onClick={() => {
                                    const text = patients.map(p => `🛏️ *${p.ward}*\n👤 *${p.name}*\n• Dx: ${p.dx}\n• Monitor: ${p.monitor}\n• COD: ${p.cod || 'None'}\n• Location: ${p.location}\n`).join("\n");
                                    navigator.clipboard.writeText(text);
                                    alert("📋 Full Viber endorsement text copied to clipboard!");
                                }} className="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow transition">
                                    💬 Viber Endorsement
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Notification Ticker */}
                    {notifications.length > 0 && (
                        <div className="bg-slate-900/80 border-b border-slate-800 px-4 py-2 text-xs">
                            <div className="max-w-7xl mx-auto flex items-center gap-3 overflow-x-auto">
                                <span className="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-bold shrink-0 animate-pulse">Live Updates</span>
                                <span className="text-slate-300 truncate font-semibold">{notifications[0].time} — {notifications[0].text}</span>
                            </div>
                        </div>
                    )}

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 py-6 space-y-8">
                        {/* SOPs Drawer */}
                        {showSops && (
                            <div className="bg-slate-900 border border-amber-500/40 rounded-2xl p-6 shadow-xl space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-base font-bold text-amber-400 flex items-center gap-2">⚠️ Standard Operating Procedures & Wound Care Rules</h2>
                                    <button onClick={() => setShowSops(false)} className="text-slate-400 hover:text-white text-sm">✕ Close</button>
                                </div>
                                <div className="grid md:grid-cols-2 gap-4 text-xs text-slate-300">
                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                                        <h3 className="font-bold text-white">🚨 Diabetic Foot & Gangrene Protocols</h3>
                                        <p><strong className="text-red-400">NO BETADINE:</strong> Strictly avoid Povidone-Iodine for Diabetic Patients (unless post-amputation closed stump).</p>
                                        <p><strong>Irrigation & Dressing:</strong> Dakin's Solution (1L PNSS + 10cc Hydrogen Peroxide) ➔ Microdacyn Gel Spray ➔ Wet-to-Dry dressing.</p>
                                    </div>
                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                                        <h3 className="font-bold text-white">🔪 Post-Amputation Rule</h3>
                                        <p>For closed amputation stumps (BKA/AKA), <strong className="text-emerald-400">Betadine is permitted</strong> for cleaning the closed surgical line, wrapped with dry sterile gauze and elastic bandage OD.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Patient Wards */}
                        {["PEDIATRICS SX WARD", "FEMALE SURGERY WARD", "MALE SURGERY WARD", "ENT / OPHTHA WARD", "ISOLATION SURGERY WARD", "SURGICAL SUITE ROOM", "CICU", "IM WARD", "PEDIATRIC WARD"].map(wardName => {
                            const wardPatients = patients.filter(p => p.ward === wardName);
                            if (wardPatients.length === 0) return null;

                            return (
                                <section key={wardName} className="space-y-4">
                                    <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                                        <h2 className="text-sm font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                                            <span>🛏️</span> {wardName}
                                        </h2>
                                        <span className="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full">{wardPatients.length} patient{wardPatients.length > 1 ? 's' : ''}</span>
                                    </div>

                                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {wardPatients.map(patient => (
                                            <div key={patient.id} className={`bg-slate-900 border rounded-2xl p-5 shadow-lg space-y-4 transition ${patient.isPostAmputation ? 'border-emerald-500/50 bg-slate-900/90' : patient.isDiabetic ? 'border-amber-500/40' : 'border-slate-800'}`}>
                                                {/* Patient Header */}
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h3 className="font-bold text-base text-white">{patient.name}</h3>
                                                        <span className="text-xs text-slate-400 flex items-center">
                                                            DX: {patient.dx}
                                                            {userRole === 'doctor' && <button onClick={() => updateFieldWithPrompt(patient.id, 'dx', patient.dx, 'Diagnosis')} className="ml-2 text-emerald-400 hover:text-emerald-300">✏️</button>}
                                                        </span>
                                                        {patient.surgery && (
                                                            <div className="text-xs text-slate-400 mt-1 flex items-center">
                                                                SX: {patient.surgery}
                                                                {userRole === 'doctor' && <button onClick={() => updateFieldWithPrompt(patient.id, 'surgery', patient.surgery, 'Surgery')} className="ml-2 text-emerald-400 hover:text-emerald-300">✏️</button>}
                                                            </div>
                                                        )}
                                                    </div>
                                                    <span className={`text-xs px-2.5 py-1 rounded-full font-semibold shrink-0 ${
                                                        patient.location === 'In OR' ? 'bg-red-500/20 text-red-400 border border-red-500/30 animate-pulse' :
                                                        patient.location.includes('X-Ray') || patient.location.includes('UTZ') || patient.location.includes('CT') ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                                                        patient.location === 'Post-Op' ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30' :
                                                        'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                                                    }`}>
                                                        📍 {patient.location}
                                                    </span>
                                                </div>

                                                {/* Amputation & Diabetic Badges */}
                                                <div className="flex flex-wrap gap-2 text-xs">
                                                    {patient.isPostAmputation ? (
                                                        <span className="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-1 rounded-lg font-medium flex items-center gap-1">
                                                            ✅ Post-Amputation • Betadine Allowed ({patient.amputationType})
                                                        </span>
                                                    ) : patient.isDiabetic ? (
                                                        <span className="bg-red-600/20 text-red-300 border border-red-500/30 px-2.5 py-1 rounded-lg font-medium">
                                                            🚨 NO BETADINE (DM Protocol)
                                                        </span>
                                                    ) : null}
                                                </div>

                                                {/* COD / Wound Care Box */}
                                                <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
                                                    <div className="flex justify-between items-center text-xs">
                                                        <span className="font-semibold text-slate-300">Wound Care / COD</span>
                                                        <span className="text-slate-400 flex items-center">
                                                            Monitor: {patient.monitor}
                                                            {userRole === 'doctor' && <button onClick={() => updateFieldWithPrompt(patient.id, 'monitor', patient.monitor, 'Monitor Orders')} className="ml-2 text-emerald-400 hover:text-emerald-300">✏️</button>}
                                                        </span>
                                                    </div>
                                                    
                                                    <div className="flex items-start justify-between bg-slate-900 p-2 rounded border border-slate-800">
                                                        <p className="text-xs text-slate-200 font-mono flex-1">{patient.cod || "No specific COD instruction."}</p>
                                                        {userRole === 'doctor' && <button onClick={() => updateFieldWithPrompt(patient.id, 'cod', patient.cod, 'Wound Care (COD) Orders')} className="ml-3 text-emerald-400 hover:text-emerald-300">✏️</button>}
                                                    </div>

                                                    {/* Clerk / Staff Action Toggles */}
                                                    <div className="flex gap-2 pt-2">
                                                        <button 
                                                            onClick={() => markActionDone(patient.id, 'codDone')}
                                                            className={`flex-1 py-2 rounded text-xs font-bold transition shadow-sm ${patient.codDone ? 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700'}`}
                                                        >
                                                            {patient.codDone ? '✅ COD Done' : '🩹 Mark COD Done'}
                                                        </button>
                                                        <button 
                                                            onClick={() => handleImageUpload(patient.id)}
                                                            className={`flex-1 py-2 rounded text-xs font-bold transition shadow-sm ${patient.picsDone ? 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700'}`}
                                                        >
                                                            {patient.picsDone ? '✅ Pics Uploaded' : '📸 Upload Pics'}
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* Post-Amputation Selector (Doctors Only or Admins) */}
                                                <div className="space-y-1.5">
                                                    <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Surgery / Amputation Type:</label>
                                                    <select 
                                                        value={patient.amputationType || ""} 
                                                        onChange={(e) => setAmputation(patient.id, e.target.value)}
                                                        disabled={userRole !== 'doctor'}
                                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed"
                                                    >
                                                        <option value="">(Select Surgery / Non-Amputation)</option>
                                                        <option value="BKA">BKA (Below-Knee Amputation)</option>
                                                        <option value="AKA">AKA (Above-Knee Amputation)</option>
                                                        <option value="Ray">Ray Amputation (Digits)</option>
                                                    </select>
                                                </div>

                                                {/* Live Location Toggles */}
                                                <div className="space-y-1.5">
                                                    <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Update Live Patient Location:</label>
                                                    <div className="grid grid-cols-3 gap-1.5">
                                                        {["In Ward", "In OR", "Post-Op", "X-Ray", "UTZ", "CT Scan"].map(loc => (
                                                            <button 
                                                                key={loc}
                                                                onClick={() => toggleLocation(patient.id, loc)}
                                                                className={`py-1.5 px-2 rounded-lg text-[11px] font-medium transition ${patient.location === loc ? 'bg-emerald-600 text-white font-bold shadow' : 'bg-slate-950 text-slate-400 hover:bg-slate-800 hover:text-white border border-slate-800'}`}
                                                            >
                                                                {loc}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* Watcher / Companion Info */}
                                                <div className="flex items-center justify-between bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 text-xs">
                                                    <span className="text-slate-400">👤 {patient.watcherName}</span>
                                                    <a href={`tel:${patient.watcherPhone}`} className="text-emerald-400 font-mono font-bold hover:underline">📞 {patient.watcherPhone}</a>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            );
                        })}
                    </main>

                    {/* Developer Footer Trigger */}
                    <footer className="max-w-7xl mx-auto px-4 mt-12 pt-6 border-t border-slate-900 text-center text-xs text-slate-600">
                        <p>Pasay City General Hospital • Surgery Department Live Tracker</p>
                        <button onClick={() => setShowDevModal(true)} className="mt-2 text-slate-700 hover:text-slate-400 transition">
                            🔐 Developer Access
                        </button>
                    </footer>

                    {/* Verify Doctor Modal */}
                    {showVerifyModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-white">🔒 Verified Doctor Login</h2>
                                    <button onClick={() => setShowVerifyModal(false)} className="text-slate-400 hover:text-white">✕</button>
                                </div>
                                <form onSubmit={handleVerifyDoctor} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-400 mb-1 block">Select Doctor:</label>
                                        <select 
                                            value={selectedDoctorName} 
                                            onChange={(e) => setSelectedDoctorName(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                                        >
                                            {DOCTORS.map(d => <option key={d.name} value={d.name}>{d.name} ({d.title})</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-400 mb-1 block">Enter 4-Digit Doctor PIN:</label>
                                        <input 
                                            type="password" 
                                            maxLength="4"
                                            value={pinInput} 
                                            onChange={(e) => setPinInput(e.target.value)}
                                            placeholder="••••"
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white tracking-widest text-center focus:outline-none focus:border-emerald-500"
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl shadow transition text-sm">
                                        Verify & Login
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Developer Modal */}
                    {showDevModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-white">🛠️ Developer File Update</h2>
                                    <button onClick={() => setShowDevModal(false)} className="text-slate-400 hover:text-white">✕</button>
                                </div>
                                <p className="text-xs text-slate-400">Enter developer passcode (2026) to download the updated HTML file for GitHub/Vercel deployment.</p>
                                <input 
                                    type="password" 
                                    value={devPasscode}
                                    onChange={(e) => setDevPasscode(e.target.value)}
                                    placeholder="Developer Passcode"
                                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white text-center focus:outline-none focus:border-emerald-500"
                                />
                                <button 
                                    onClick={() => {
                                        if (devPasscode === "2026") {
                                            downloadHtmlFile();
                                            setShowDevModal(false);
                                            setDevPasscode("");
                                        } else {
                                            alert("Incorrect Developer Passcode.");
                                        }
                                    }}
                                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow transition text-sm"
                                >
                                    Download Updated index.html
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
