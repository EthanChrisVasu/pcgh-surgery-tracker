            { id: 20, name: "Atanante, Jennifer", ward: "IM WARD", dx: "Cellulitis / Wound Care", surgery: "", monitor: "VSQ4", cod: "Hansol Chlorhexidine Gluconate 4% Topical Solution + Bactromed Mupirocin Ointment (2% w/w). (If patient denies, leave open).", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0120", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, codImages: [] },
            { id: 21, name: "Garrido", ward: "IM WARD", dx: "Sacral Ulcers", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution OD", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0121", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, codImages: [] },
            { id: 22, name: "Ellaso, Eric (56/M)", ward: "IM WARD", dx: "Wound Care", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution OD. (Note: Put 1 wet gauze inside the wound).", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0122", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, codImages: [] },
            { id: 23, name: "Castillejos, Draven Mell (2/M)", ward: "PEDIATRIC WARD", dx: "Perianal Cellulitis/Abscess, T/C Sepsis, T/C ALL", surgery: "", monitor: "VSQ4", cod: "Apply Flammazine and wound care BID", location: "In Ward", watcherName: "Parent / Guardian", watcherPhone: "0917-550-0123", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, codImages: [] }
        ];

        const DOCTORS = [
            { name: "Dr. Glenn Camaymayan", pin: "1101", title: "Surgery Resident / Consultant" },
            { name: "Dr. Ruby T.", pin: "1102", title: "Surgery Resident / Consultant" },
            { name: "Dr. Osorio", pin: "1103", title: "Surgery Resident / Consultant" }
        ];

        function App() {
            // --- AUTHENTICATION STATE ---
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [userRole, setUserRole] = useState(null); 
            const [activeUser, setActiveUser] = useState(""); 
            const [loginTab, setLoginTab] = useState('clerk'); 
            
            // Login Form States
            const [clerkNameInput, setClerkNameInput] = useState("");
            const [clerkIdInput, setClerkIdInput] = useState("");
            const [clerkShift, setClerkShift] = useState("AM"); 
            const [selectedDoctorName, setSelectedDoctorName] = useState(DOCTORS[0].name);
            const [doctorPinInput, setDoctorPinInput] = useState("");

            // --- APP DATA STATE ---
            const [patients, setPatients] = useState(INITIAL_PATIENTS);
            const [notifications, setNotifications] = useState([]);
            const [isOnline, setIsOnline] = useState(false);
            
            // --- MODAL & UI STATES ---
            const [showSops, setShowSops] = useState(false);
            const [uploadModal, setUploadModal] = useState(null); 
            const [viewImages, setViewImages] = useState(null); 
            const [currentImageIndex, setCurrentImageIndex] = useState(0);
            
            // Activity Log & Highlighting
            const [showActivityLog, setShowActivityLog] = useState(false);
            const [highlightedPatient, setHighlightedPatient] = useState(null);

            // 🔥 FIREBASE REAL-TIME SYNC 🔥
            useEffect(() => {
                if (!isAuthenticated || !db) return;

                const patientsRef = db.ref('pcgh/patients');
                const notifsRef = db.ref('pcgh/notifications');

                patientsRef.on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        let data = snapshot.val();
                        let safeArray = Array.isArray(data) ? data : Object.values(data);
                        setPatients(safeArray.filter(Boolean));
                    } else {
                        patientsRef.set(INITIAL_PATIENTS);
                    }
                    setIsOnline(true);
                });

                notifsRef.on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        let notifData = snapshot.val();
                        let safeNotifs = Array.isArray(notifData) ? notifData : Object.values(notifData);
                        setNotifications(safeNotifs.filter(Boolean));
                    }
                });

                return () => {
                    patientsRef.off();
                    notifsRef.off();
                };
            }, [isAuthenticated]);

            const syncPatients = (updaterFn) => {
                setPatients(prev => {
                    const next = updaterFn(prev);
                    if (db) db.ref('pcgh/patients').set(next);
                    return next;
                });
            };

            // Upgraded Notification Function (Now Accepts Patient ID)
            const addNotification = (text, patientId = null) => {
                setNotifications(prev => {
                    const newNotifs = [{ id: Date.now(), text, time: new Date().toLocaleTimeString(), patientId }, ...prev.slice(0, 39)]; // Keep 40 history items
                    if (db) db.ref('pcgh/notifications').set(newNotifs);
                    return newNotifs;
                });
            };

            // --- HANDLERS ---
            const handleClerkLogin = (e) => {
                e.preventDefault();
                if (clerkNameInput.trim() === "") return alert("Please enter your name.");
                const formattedName = `${clerkNameInput}${clerkIdInput ? ` (${clerkIdInput})` : ''} - ${clerkShift} Shift`;
                setActiveUser(formattedName);
                setUserRole("clerk");
                setIsAuthenticated(true);
            };

            const handleDoctorLogin = (e) => {
                e.preventDefault();
                const doc = DOCTORS.find(d => d.name === selectedDoctorName);
                if (doc && doc.pin === doctorPinInput) {
                    setActiveUser(doc.name);
                    setUserRole("doctor");
                    setIsAuthenticated(true);
                    setDoctorPinInput("");
                } else {
                    alert("Incorrect Doctor PIN. Please verify your credentials.");
                }
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                setUserRole(null);
                setActiveUser("");
                setIsOnline(false);
            };

            // STRICT WARD RESET: Only touches codDone and codImages
            const handleDailyReset = () => {
                if (window.confirm("🚨 Are you sure you want to RESET all COD statuses and delete all images for a new day? Patient locations, diagnoses, and orders will NOT be changed. This cannot be undone.")) {
                    syncPatients(prev => prev.map(p => ({ ...p, codDone: false, codImages: [] })));
                    addNotification(`🌅 ${activeUser} performed a New Day Reset (Cleared all COD tasks and photos).`);
                }
            };

            // Navigate and Highlight Patient from Activity Log
            const jumpToPatient = (patientId) => {
                if (!patientId) return;
                setShowActivityLog(false);
                setHighlightedPatient(patientId);
                
                // Remove highlight after 4 seconds
                setTimeout(() => setHighlightedPatient(null), 4000);
                
                // Smooth scroll to the patient card
                const el = document.getElementById('patient-' + patientId);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            };

            const updatePatientField = (id, field, value, fieldName) => {
                const targetPatient = patients.find(p => p.id === id);
                if (!targetPatient) return;
                addNotification(`📝 ${activeUser} updated ${targetPatient.name}'s ${fieldName}.`, id);
                syncPatients(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
            };

            const updateFieldWithPrompt = (id, field, currentValue, fieldName) => {
                const newValue = prompt(`Doctor's Override - Enter new ${fieldName}:`, currentValue);
                if (newValue !== null && newValue !== currentValue) {
                    updatePatientField(id, field, newValue, fieldName);
                }
            };

            const handleFileSelect = (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                
                if (uploadModal.images.length + files.length > 6) {
                    alert("You can only upload up to 6 images per patient.");
                    return;
                }

                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            const MAX_WIDTH = 800; 
                            const scaleSize = MAX_WIDTH / img.width;
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleSize;
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const base64Img = canvas.toDataURL('image/jpeg', 0.6); 

                            setUploadModal(prev => ({
                                ...prev,
                                images: [...prev.images, base64Img]
                            }));
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const submitCodProof = () => {
                if (uploadModal.images.length === 0) {
                    return alert("Please add at least one image to complete COD.");
                }
                const patientName = patients.find(p => p.id === uploadModal.patientId)?.name || "a patient";
                addNotification(`📸 ${activeUser} uploaded COD proof and marked it DONE for ${patientName}.`, uploadModal.patientId);
                
                syncPatients(prev => prev.map(p => 
                    p.id === uploadModal.patientId 
                    ? { ...p, codImages: uploadModal.images, codDone: true } 
                    : p
                ));
                setUploadModal(null);
            };

            const toggleLocation = (id, newLoc) => {
                const targetPatient = patients.find(p => p.id === id);
                if (!targetPatient) return;
                addNotification(`📍 ${activeUser} moved ${targetPatient.name} to [${newLoc}].`, id);
                syncPatients(prev => prev.map(p => p.id === id ? { ...p, location: newLoc } : p));
            };

            const setAmputation = (id, type) => {
                const p = patients.find(pat=>pat.id===id);
                if (!p) return;
                let codText = p.cod;
                if (type) {
                    codText = "Clean closed surgical stump with Povidone-Iodine (Betadine), pat dry, and wrap with dry sterile gauze & elastic bandage OD.";
                }
                addNotification(`🔪 ${activeUser} updated Amputation Type to ${type || 'None'} for ${p.name}.`, id);
                
                syncPatients(prev => prev.map(pat => pat.id === id ? { 
                    ...pat, 
                    isPostAmputation: !!type, 
                    amputationType: type, 
                    surgery: type ? `${type} Amputation` : pat.surgery,
                    cod: codText
                } : pat));
            };

            // ==========================================
            // RENDER: LOGIN GATEWAY
            // ==========================================
            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
                            <div className="bg-slate-900 p-8 text-center space-y-3">
                                <div className="mx-auto bg-emerald-500 w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg">
                                    <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                                </div>
                                <h1 className="text-xl font-bold tracking-tight text-white">PCGH Surgery Ward</h1>
                                <p className="text-sm text-slate-400 font-medium">Real-Time Tracker Access Portal</p>
                            </div>

                            <div className="flex border-b border-slate-200">
                                <button type="button" onClick={() => setLoginTab('clerk')} className={`flex-1 py-4 text-sm font-bold transition ${loginTab === 'clerk' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50/50' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    📋 Clerk Login
                                </button>
                                <button type="button" onClick={() => setLoginTab('doctor')} className={`flex-1 py-4 text-sm font-bold transition ${loginTab === 'doctor' ? 'text-emerald-600 border-b-2 border-emerald-600 bg-emerald-50/50' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    👨‍⚕️ Doctor Login
                                </button>
                            </div>

                            <div className="p-8">
                                <div className={loginTab === 'clerk' ? 'block' : 'hidden'}>
                                    <form onSubmit={handleClerkLogin} className="space-y-5">
                                        <div>
                                            <label className="text-xs font-bold text-slate-700 mb-1.5 block">Clerk Name</label>
                                            <input type="text" required value={clerkNameInput} onChange={(e) => setClerkNameInput(e.target.value)} placeholder="e.g., Ethan" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 font-medium focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-700 mb-1.5 block">Clerk ID / Group / School (Optional)</label>
                                            <input type="text" value={clerkIdInput} onChange={(e) => setClerkIdInput(e.target.value)} placeholder="e.g., Group Leader, AMA" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 font-medium focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-700 mb-1.5 block">Shift Time</label>
                                            <div className="flex gap-3">
                                                <label className={`flex-1 py-3 text-center rounded-xl border text-sm font-bold cursor-pointer transition ${clerkShift === 'AM' ? 'bg-blue-50 border-blue-500 text-blue-700' : 'bg-white border-slate-300 text-slate-500 hover:bg-slate-50'}`}>
                                                    <input type="radio" name="shift" value="AM" className="hidden" checked={clerkShift === 'AM'} onChange={(e) => setClerkShift(e.target.value)} />
                                                    ☀️ AM Shift
                                                </label>
                                                <label className={`flex-1 py-3 text-center rounded-xl border text-sm font-bold cursor-pointer transition ${clerkShift === 'PM' ? 'bg-blue-50 border-blue-500 text-blue-700' : 'bg-white border-slate-300 text-slate-500 hover:bg-slate-50'}`}>
                                                    <input type="radio" name="shift" value="PM" className="hidden" checked={clerkShift === 'PM'} onChange={(e) => setClerkShift(e.target.value)} />
                                                    🌙 PM Shift
                                                </label>
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-blue-600/20 transition mt-2">
                                            Access Ward Tracker
                                        </button>
                                    </form>
                                </div>

                                <div className={loginTab === 'doctor' ? 'block' : 'hidden'}>
                                    <form onSubmit={handleDoctorLogin} className="space-y-5">
                                        <div>
                                            <label className="text-xs font-bold text-slate-700 mb-1.5 block">Select Attending / Resident</label>
                                            <select value={selectedDoctorName} onChange={(e) => setSelectedDoctorName(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 font-medium focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                                                {DOCTORS.map(d => <option key={d.name} value={d.name}>{d.name} ({d.title})</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-700 mb-1.5 block">Secure PIN</label>
                                            <input type="password" required maxLength="4" value={doctorPinInput} onChange={(e) => setDoctorPinInput(e.target.value)} placeholder="••••" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 tracking-widest text-center font-bold focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500" />
                                        </div>
                                        <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-emerald-600/20 transition mt-2">
                                            Authenticate and Enter
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // RENDER: MAIN WARD TRACKER
            // ==========================================
            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 pb-16">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3 shadow-sm">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-emerald-600 p-2.5 rounded-xl shadow-sm">
                                    <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="text-lg font-bold tracking-tight text-slate-900">PCGH Surgery Ward</h1>
                                        <span className={`text-xs px-2.5 py-1 rounded-full font-bold shadow-sm border ${userRole === 'doctor' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-blue-50 text-blue-700 border-blue-200'}`}>
                                            {userRole === 'doctor' ? `👨‍⚕️ ${activeUser}` : `📋 ${activeUser}`}
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-500 font-medium">
                                        {isOnline ? <span className="text-emerald-600 flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Firebase Cloud Sync Active</span> : "Connecting to Cloud..."}
                                    </p>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2">
                                {userRole === 'doctor' && (
                                    <button onClick={handleDailyReset} className="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-3.5 py-2 rounded-lg text-xs font-bold transition">
                                        🌅 Reset Ward (New Day)
                                    </button>
                                )}
                                <button onClick={() => setShowSops(!showSops)} className="bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 px-3.5 py-2 rounded-lg text-xs font-bold transition">
                                    📋 SOPs & Rules
                                </button>
                                
                                <button onClick={handleLogout} className="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-3.5 py-2 rounded-lg text-xs font-bold transition">
                                    Sign Out
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* INTERACTIVE NOTIFICATION BAR */}
                    {notifications.length > 0 && (
                        <div onClick={() => setShowActivityLog(true)} className="bg-white border-b border-slate-200 px-4 py-2.5 shadow-sm cursor-pointer hover:bg-slate-50 transition flex items-center justify-between group">
                            <div className="max-w-7xl mx-auto flex items-center gap-3 overflow-hidden flex-1">
                                <span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs font-bold shrink-0 border border-blue-200">Live Sync</span>
                                <span className="text-slate-600 text-xs truncate font-semibold">{notifications[0].time} — {notifications[0].text}</span>
                            </div>
                            <span className="text-blue-600 font-bold text-xs shrink-0 pl-4 flex items-center gap-1 group-hover:text-blue-700">
                                View Log ➔
                            </span>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-4 py-6 space-y-8">
                        {showSops && (
                            <div className="bg-white border border-amber-200 rounded-2xl p-6 shadow-md space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-base font-bold text-amber-600 flex items-center gap-2">⚠️ Standard Operating Procedures & Wound Care Rules</h2>
                                    <button onClick={() => setShowSops(false)} className="text-slate-400 hover:text-slate-700 text-sm font-bold">✕ Close</button>
                                </div>
                                <div className="grid md:grid-cols-2 gap-4 text-xs text-slate-600">
                                    <div className="bg-amber-50/50 p-4 rounded-xl border border-amber-100 space-y-2">
                                        <h3 className="font-bold text-slate-800">🚨 Diabetic Foot & Gangrene Protocols</h3>
                                        <p><strong className="text-red-600">NO BETADINE:</strong> Strictly avoid Povidone-Iodine for Diabetic Patients (unless post-amputation closed stump).</p>
                                        <p><strong>Irrigation & Dressing:</strong> Dakin's Solution (1L PNSS + 10cc Hydrogen Peroxide) ➔ Microdacyn Gel Spray ➔ Wet-to-Dry dressing.</p>
                                    </div>
                                    <div className="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100 space-y-2">
                                        <h3 className="font-bold text-slate-800">🔪 Post-Amputation Rule</h3>
                                        <p>For closed amputation stumps (BKA/AKA), <strong className="text-emerald-600">Betadine is permitted</strong> for cleaning the closed surgical line, wrapped with dry sterile gauze and elastic bandage OD.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {["PEDIATRICS SX WARD", "FEMALE SURGERY WARD", "MALE SURGERY WARD", "ENT / OPHTHA WARD", "ISOLATION SURGERY WARD", "SURGICAL SUITE ROOM", "CICU", "IM WARD", "PEDIATRIC WARD"].map(wardName => {
                            const wardPatients = patients.filter(p => p && p.ward === wardName);
                            if (wardPatients.length === 0) return null;

                            return (
                                <section key={wardName} className="space-y-4">
                                    <div className="flex items-center justify-between border-b border-slate-300 pb-2">
                                        <h2 className="text-sm font-bold uppercase tracking-wider text-slate-800 flex items-center gap-2">
                                            <span>🛏️</span> {wardName}
                                        </h2>
                                        <span className="text-xs bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full font-semibold border border-slate-300">{wardPatients.length} patient{wardPatients.length > 1 ? 's' : ''}</span>
                                    </div>

                                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
                                        {wardPatients.map(patient => (
                                            <div 
                                                key={patient.id} 
                                                id={`patient-${patient.id}`}
                                                className={`bg-white border rounded-2xl p-5 shadow-sm space-y-4 transition-all duration-700 ${
                                                    highlightedPatient === patient.id ? 'ring-4 ring-blue-500 shadow-blue-500/50 scale-[1.02] border-blue-500 z-10 relative' : 
                                                    patient.isPostAmputation ? 'border-emerald-300 bg-emerald-50/30' : 
                                                    patient.isDiabetic ? 'border-amber-300 bg-amber-50/20' : 'border-slate-200'
                                                }`}
                                            >
                                                
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h3 className="font-bold text-lg text-slate-900 leading-tight">{patient.name}</h3>
                                                        <span className="text-xs text-slate-600 font-medium flex items-center mt-1">
                                                            DX: {patient.dx}
                                                            {userRole === 'doctor' && <button onClick={() => updateFieldWithPrompt(patient.id, 'dx', patient.dx, 'Diagnosis')} className="ml-1.5 text-blue-500 hover:text-blue-700">✏️</button>}
                                                        </span>
                                                        {patient.surgery && (
                                                            <div className="text-xs text-slate-600 font-medium mt-0.5 flex items-center">
                                                                SX: {patient.surgery}
                                                                {userRole === 'doctor' && <button onClick={() => updateFieldWithPrompt(patient.id, 'surgery', patient.surgery, 'Surgery')} className="ml-1.5 text-blue-500 hover:text-blue-700">✏️</button>}
                                                            </div>
                                                        )}
                                                    </div>
                                                    <span className={`text-xs px-2.5 py-1 rounded-full font-bold shrink-0 border shadow-sm ${
                                                        patient.location === 'In OR' ? 'bg-red-50 text-red-700 border-red-200 animate-pulse' :
                                                        patient.location.includes('X-Ray') || patient.location.includes('UTZ') || patient.location.includes('CT') ? 'bg-amber-50 text-amber-700 border-amber-200' :
                                                        patient.location === 'Post-Op' ? 'bg-indigo-50 text-indigo-700 border-indigo-200' :
                                                        'bg-emerald-50 text-emerald-700 border-emerald-200'
                                                    }`}>
                                                        📍 {patient.location}
                                                    </span>
                                                </div>

                                                <div className="flex flex-wrap gap-2 text-xs">
                                                    {patient.isPostAmputation ? (
                                                        <span className="bg-emerald-50 text-emerald-700 border border-emerald-300 px-2.5 py-1 rounded-lg font-bold flex items-center gap-1">
                                                            ✅ Betadine Allowed ({patient.amputationType})
                                                        </span>
                                                    ) : patient.isDiabetic ? (
                                                        <span className="bg-red-50 text-red-700 border border-red-300 px-2.5 py-1 rounded-lg font-bold">
                                                            🚨 NO BETADINE (DM Protocol)
                                                        </span>
                                                    ) : null}
                                                </div>

                                                <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-100 space-y-3">
                                                    <div className="flex justify-between items-center text-xs">
                                                        <span className="font-bold text-slate-800">Wound Care / COD</span>
                                                        <span className="text-slate-600 font-semibold flex items-center bg-white px-2 py-1 rounded border border-slate-200 shadow-sm">
                                                            Monitor: {patient.monitor}
                                                            {userRole === 'doctor' && <button onClick={() => updateFieldWithPrompt(patient.id, 'monitor', patient.monitor, 'Monitor Orders')} className="ml-1.5 text-blue-500 hover:text-blue-700">✏️</button>}
                                                        </span>
                                                    </div>
                                                    
                                                    <div className="flex items-start justify-between bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm">
                                                        <p className="text-xs text-slate-700 font-medium flex-1">{patient.cod || "No specific COD instruction."}</p>
                                                        {userRole === 'doctor' && <button onClick={() => updateFieldWithPrompt(patient.id, 'cod', patient.cod, 'Wound Care (COD)')} className="ml-3 text-blue-500 hover:text-blue-700">✏️</button>}
                                                    </div>

                                                    <div className="pt-1">
                                                        {patient.codDone ? (
                                                            <button onClick={() => {
                                                                let imgs = patient.codImages && patient.codImages.length > 0 ? patient.codImages : [patient.codImage].filter(Boolean);
                                                                if(imgs.length > 0) {
                                                                    setViewImages(imgs); 
                                                                    setCurrentImageIndex(0);
                                                                }
                                                            }} className="w-full bg-emerald-50 text-emerald-700 border border-emerald-200 py-2.5 rounded-lg text-xs font-bold hover:bg-emerald-100 transition shadow-sm flex items-center justify-center gap-1.5">
                                                                ✅ COD Completed (View Proof)
                                                            </button>
                                                        ) : (
                                                            userRole === 'clerk' ? (
                                                                <button onClick={() => setUploadModal({ patientId: patient.id, images: [] })} className="w-full bg-white text-blue-600 border border-blue-300 py-2.5 rounded-lg text-xs font-bold hover:bg-blue-50 transition shadow-sm flex items-center justify-center gap-1.5">
                                                                    📸 Upload Proof to Complete COD
                                                                </button>
                                                            ) : (
                                                                <div className="w-full bg-slate-100 text-slate-500 border border-slate-200 py-2.5 rounded-lg text-xs font-bold text-center flex items-center justify-center gap-1.5">
                                                                    ⏳ Waiting for Clerk to upload Proof
                                                                </div>
                                                            )
                                                        )}
                                                    </div>
                                                </div>

                                                <div className="space-y-1.5">
                                                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Surgery / Amputation Type:</label>
                                                    <select 
                                                        value={patient.amputationType || ""} 
                                                        onChange={(e) => setAmputation(patient.id, e.target.value)}
                                                        disabled={userRole !== 'doctor'}
                                                        className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-800 font-medium focus:outline-none focus:border-emerald-500 disabled:opacity-60 disabled:cursor-not-allowed disabled:bg-slate-100"
                                                    >
                                                        <option value="">(Select Surgery / Non-Amputation)</option>
                                                        <option value="BKA">BKA (Below-Knee Amputation)</option>
                                                        <option value="AKA">AKA (Above-Knee Amputation)</option>
                                                        <option value="Ray">Ray Amputation (Digits)</option>
                                                    </select>
                                                </div>

                                                <div className="space-y-2 pt-1">
                                                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Update Location:</label>
                                                    <div className="grid grid-cols-3 gap-1.5">
                                                        {["In Ward", "In OR", "Post-Op", "X-Ray", "UTZ", "CT Scan"].map(loc => (
                                                            <button 
                                                                key={loc}
                                                                onClick={() => toggleLocation(patient.id, loc)}
                                                                className={`py-1.5 px-2 rounded-lg text-[11px] font-bold transition shadow-sm border ${patient.location === loc ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 hover:bg-slate-100 border-slate-300'}`}
                                                            >
                                                                {loc}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div className="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 text-xs mt-2">
                                                    <span className="text-slate-600 font-medium">👤 {patient.watcherName}</span>
                                                    <a href={`tel:${patient.watcherPhone}`} className="text-emerald-600 font-mono font-bold hover:underline">📞 {patient.watcherPhone}</a>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            );
                        })}
                    </main>

                    {/* ACTIVITY LOG MODAL */}
                    {showActivityLog && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[80] flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-2xl max-w-lg w-full max-h-[80vh] flex flex-col shadow-2xl">
                                <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                                    <h2 className="text-lg font-bold text-slate-900">📋 Activity & Update Log</h2>
                                    <button onClick={() => setShowActivityLog(false)} className="text-slate-400 hover:text-slate-600 font-bold px-2 text-lg">✕</button>
                                </div>
                                <div className="p-4 overflow-y-auto flex-1 space-y-3">
                                    {notifications.map(n => (
                                        <div 
                                            key={n.id} 
                                            onClick={() => jumpToPatient(n.patientId)} 
                                            className={`p-3 rounded-lg border text-sm ${n.patientId ? 'bg-white border-slate-200 hover:border-blue-400 hover:shadow-md cursor-pointer transition' : 'bg-slate-50 border-slate-100 text-slate-500'}`}
                                        >
                                            <div className="text-xs text-slate-400 font-bold mb-1">{n.time}</div>
                                            <div className="text-slate-700 font-medium">{n.text}</div>
                                            {n.patientId && <div className="text-xs text-blue-600 font-bold mt-2 flex items-center gap-1">Jump to Patient ➔</div>}
                                        </div>
                                    ))}
                                    {notifications.length === 0 && <div className="text-center text-slate-400 text-sm py-4">No recent activity.</div>}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MULTI-IMAGE UPLOAD MODAL */}
                    {uploadModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-slate-900">📸 Upload COD Proof</h2>
                                    <button onClick={() => setUploadModal(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>
                                
                                <p className="text-xs text-slate-500 font-medium">Add up to 6 images to prove Wound Care completion.</p>
                                
                                <div className="grid grid-cols-3 gap-2">
                                    {uploadModal.images.map((img, idx) => (
                                        <div key={idx} className="relative group aspect-square">
                                            <img src={img} className="w-full h-full object-cover rounded-lg border border-slate-200 shadow-sm" />
                                            <button onClick={() => setUploadModal(prev => ({...prev, images: prev.images.filter((_, i) => i !== idx)}))} className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-md border-2 border-white font-bold">✕</button>
                                        </div>
                                    ))}
                                    
                                    {uploadModal.images.length < 6 && (
                                        <label className="border-2 border-dashed border-slate-300 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:text-blue-600 hover:border-blue-400 hover:bg-blue-50 transition cursor-pointer aspect-square bg-slate-50">
                                            <span className="text-2xl font-bold">+</span>
                                            <span className="text-[10px] font-bold mt-1">Add Photo</span>
                                            <input type="file" multiple accept="image/*" className="hidden" onChange={handleFileSelect} />
                                        </label>
                                    )}
                                </div>

                                <div className="pt-4 flex gap-3">
                                    <button onClick={() => setUploadModal(null)} className="flex-1 py-3 rounded-xl font-bold text-sm bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Cancel</button>
                                    <button onClick={submitCodProof} disabled={uploadModal.images.length === 0} className="flex-1 py-3 rounded-xl font-bold text-sm bg-emerald-600 text-white hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed transition shadow-sm">Submit Proof</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FULL-SCREEN IMAGE GALLERY VIEWER */}
                    {viewImages && viewImages.length > 0 && (
                        <div className="fixed inset-0 bg-slate-900/95 z-[70] flex flex-col items-center justify-center p-4 backdrop-blur-sm" onClick={(e) => { if(e.target === e.currentTarget) setViewImages(null); }}>
                            
                            <button onClick={() => setViewImages(null)} className="fixed top-6 right-6 text-white font-bold text-sm bg-slate-800 hover:bg-slate-700 px-5 py-2.5 rounded-full transition border border-slate-700 shadow-xl z-50">✕ Close Proof</button>
                            
                            <div className="max-w-4xl w-full flex flex-col items-center gap-6 mt-12">
                                <img src={viewImages[currentImageIndex]} alt={`Proof ${currentImageIndex+1}`} className="max-h-[70vh] w-auto rounded-xl shadow-2xl border-4 border-slate-200 object-contain" />
                                
                                {viewImages.length > 1 && (
                                    <div className="flex items-center gap-6 bg-slate-800/80 px-6 py-3 rounded-full border border-slate-700">
                                        <button onClick={() => setCurrentImageIndex(i => Math.max(0, i - 1))} disabled={currentImageIndex === 0} className="bg-white/20 p-2 rounded-full text-white disabled:opacity-20 hover:bg-white/30 transition">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M15 19l-7-7 7-7"/></svg>
                                        </button>
                                        <span className="text-white font-bold tracking-widest text-sm">{currentImageIndex + 1} / {viewImages.length}</span>
                                        <button onClick={() => setCurrentImageIndex(i => Math.min(viewImages.length - 1, i + 1))} disabled={currentImageIndex === viewImages.length - 1} className="bg-white/20 p-2 rounded-full text-white disabled:opacity-20 hover:bg-white/30 transition">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M9 5l7 7-7 7"/></svg>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
