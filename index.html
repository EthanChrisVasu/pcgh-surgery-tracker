        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [userRole, setUserRole] = useState(null); 
            const [activeUser, setActiveUser] = useState(""); 
            const [loginTab, setLoginTab] = useState('clerk'); 
            
            const [clerkNameInput, setClerkNameInput] = useState("");

            const [clerkShift, setClerkShift] = useState("AM"); 
            const [selectedDoctorName, setSelectedDoctorName] = useState(DOCTORS[0].name);
            const [doctorPinInput, setDoctorPinInput] = useState("");

            const [showVersionModal, setShowVersionModal] = useState(false);

            const [patients, setPatients] = useState(INITIAL_PATIENTS);
            const [notifications, setNotifications] = useState([]);
            const [isOnline, setIsOnline] = useState(false);
            
            const [showSops, setShowSops] = useState(false);
            const [uploadModal, setUploadModal] = useState(null); 
            const [viewImages, setViewImages] = useState(null); 
            const [currentImageIndex, setCurrentImageIndex] = useState(0);
            const [showActivityLog, setShowActivityLog] = useState(false);
            const [highlightedPatient, setHighlightedPatient] = useState(null);
            
            // Modals
            const [orderModal, setOrderModal] = useState(null); 
            const [viewOrdersModal, setViewOrdersModal] = useState(null); 
            const [vitalsModal, setVitalsModal] = useState(null); 
            const [cbgModal, setCbgModal] = useState(null);       
            const [viewVitalsModal, setViewVitalsModal] = useState(null); 
            const [viewCbgModal, setViewCbgModal] = useState(null);       
            const [addPatientModal, setAddPatientModal] = useState(false);

            useEffect(() => {
                if (!isAuthenticated || !db) return;

                const patientsRef = db.ref('pcgh/patients');
                const notifsRef = db.ref('pcgh/notifications');

                patientsRef.on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        let data = snapshot.val();
                        let safeArray = Array.isArray(data) ? data : Object.values(data);
                        
                        const now = Date.now();
                        const cleanedArray = safeArray.filter(Boolean).map(p => {
                            if (p.isDischarged && p.dischargeTimestamp) {
                                const hoursPassed = (now - p.dischargeTimestamp) / (1000 * 60 * 60);
                                if (hoursPassed >= 24) {
                                    return null; 
                                }
                            }
                            return p;
                        }).filter(Boolean);

                        setPatients(cleanedArray);
                    } else {
                        patientsRef.set(INITIAL_PATIENTS);
                    }
                    setIsOnline(true);
                });

                notifsRef.on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        let notifData = snapshot.val();
                        let safeNotifs = Array.isArray(notifData) ? notifData : Object.values(notifData);
                        setNotifications(safeNotifs.filter(Boolean));
                    }
                });

                return () => {
                    patientsRef.off();
                    notifsRef.off();
                };
            }, [isAuthenticated]);

            const syncPatients = (updaterFn) => {
                setPatients(prev => {
                    const next = updaterFn(prev);
                    if (db) db.ref('pcgh/patients').set(next);
                    return next;
                });
            };

            const addNotification = (text, patientId = null) => {
                let cleanText = text.replace(/Dr\.\s*Dr\./g, 'Dr.');
                setNotifications(prev => {
                    const newNotifs = [{ id: Date.now(), text: cleanText, time: new Date().toLocaleTimeString(), patientId }, ...prev.slice(0, 39)];
                    if (db) db.ref('pcgh/notifications').set(newNotifs);
                    return newNotifs;
                });
            };

            const handleClerkLogin = (e) => {
                e.preventDefault();
                if (clerkNameInput.trim() === "") return alert("Please enter your name.");
                const formattedName = `${clerkNameInput}${clerkIdInput ? ` (${clerkIdInput})` : ''} - ${clerkShift} Shift`;
                setActiveUser(formattedName);
                setUserRole("clerk");
                setIsAuthenticated(true);
                setShowVersionModal(true);
            };

            const handleDoctorLogin = (e) => {
                e.preventDefault();
                const doc = DOCTORS.find(d => d.name === selectedDoctorName);
                if (doc && doc.pin === doctorPinInput) {
                    const cleanDocName = doc.name.replace(/^Dr\.\s*/, '');
                    setActiveUser(`Dr. ${cleanDocName} ✔️`);
                    setUserRole("doctor");
                    setIsAuthenticated(true);
                    setDoctorPinInput("");
                    setShowVersionModal(true);
                } else {
                    alert("Incorrect Doctor PIN.");
                }
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                setUserRole(null);
                setActiveUser("");
                setIsOnline(false);
            };

            const handleDailyReset = () => {
                if (window.confirm("🚨 Reset all COD statuses, images, vitals, and CBG logs for a new day? Patient orders remain safe.")) {
                    syncPatients(prev => prev.map(p => ({ ...p, codDone: false, codImages: [], vitalsHistory: [], cbgHistory: [] })));
                    addNotification(`🌅 ${activeUser} performed a New Day Reset (Cleared COD, photos, vitals, & CBG logs).`);
                }
            };

            const jumpToPatient = (patientId) => {
                if (!patientId) return;
                setShowActivityLog(false);
                setHighlightedPatient(patientId);
                setTimeout(() => setHighlightedPatient(null), 4000);
                const el = document.getElementById('patient-' + patientId);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            };

            const updatePatientField = (id, field, value, fieldName) => {
                const targetPatient = patients.find(p => p.id === id);
                if (!targetPatient) return;
                addNotification(`📝 ${activeUser} updated ${targetPatient.name}'s ${fieldName}.`, id);
                syncPatients(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
            };

            const updateFieldWithPrompt = (id, field, currentValue, fieldName) => {
                const newValue = prompt(`Doctor's Override - Enter new ${fieldName}:`, currentValue);
                if (newValue !== null && newValue !== currentValue) {
                    updatePatientField(id, field, newValue, fieldName);
                }
            };

            const editWatcher = (id) => {
                const p = patients.find(pat => pat.id === id);
                if (!p) return;
                const newName = prompt("Enter Watcher / Guardian Name:", p.watcherName || "Family Watcher");
                if (newName === null) return;
                const newPhone = prompt("Enter Watcher / Guardian Phone Number:", p.watcherPhone || "0917-000-0000");
                if (newPhone === null) return;

                addNotification(`👤 ${activeUser} updated Watcher details for ${p.name}.`, id);
                syncPatients(prev => prev.map(pat => pat.id === id ? { ...pat, watcherName: newName.toUpperCase(), watcherPhone: newPhone } : pat));
            };

            const updateWoundCareProtocol = (id, protocolType, timingAbbr) => {
                const p = patients.find(pat => pat.id === id);
                if (!p) return;

                let baseText = "";
                if (protocolType === 'BETADINE') baseText = "DRY WITH BETADINE";
                else if (protocolType === 'DAKINS') baseText = "WET-TO-DRY WITH DAKIN'S SOLUTION";
                else if (protocolType === 'THIRDS') baseText = "WET-TO-DRY WITH THIRD'S SOLUTION";

                const finalCod = `${baseText} ${timingAbbr}`;

                addNotification(`⚕️ ${activeUser} updated Special Wound Care Instructions to [${finalCod}] for ${p.name}.`, id);
                syncPatients(prev => prev.map(pat => pat.id === id ? { ...pat, cod: finalCod, codTiming: timingAbbr } : pat));
            };

            const updateCustomWoundCare = (id, newText) => {
                const p = patients.find(pat => pat.id === id);
                if (!p) return;
                const upperText = newText.toUpperCase();

                addNotification(`⚕️ ${activeUser} updated Special Wound Care Instructions for ${p.name}.`, id);
                syncPatients(prev => prev.map(pat => pat.id === id ? { ...pat, cod: upperText } : pat));
            };

            const toggleBetadineAllowance = (id) => {
                const p = patients.find(pat => pat.id === id);
                if (!p) return;
                const newStatus = !p.isPostAmputation;

                addNotification(`⚕️ ${activeUser} toggled Betadine Allowance ${newStatus ? 'ALLOWED' : 'RESTRICTED'} for ${p.name}.`, id);
                syncPatients(prev => prev.map(pat => pat.id === id ? { ...pat, isPostAmputation: newStatus } : pat));
            };

            const toggleNeedsWoundCare = (id) => {
                const p = patients.find(pat => pat.id === id);
                if (!p) return;
                const newStatus = !(p.needsWoundCare !== false);

                addNotification(`⚕️ ${activeUser} toggled Wound Care status to [${newStatus ? 'Wound Care Needed' : 'Monitor Only'}] for ${p.name}.`, id);
                syncPatients(prev => prev.map(pat => pat.id === id ? { ...pat, needsWoundCare: newStatus } : pat));
            };

            const handleAddPatientSubmit = (e) => {
                e.preventDefault();
                const form = e.target;
                
                let finalCod = "";
                if (form.codProtocol.value === 'CUSTOM') {
                    finalCod = form.customCod.value.toUpperCase();
                } else {
                    finalCod = `${form.codProtocol.value} ${form.codTiming.value}`;
                }

                    needsWoundCare: true,
                    codDone: false,
                    codImages: [],
                    physicianOrders: [],
                    vitalsHistory: [],
                    cbgHistory: [],
                    isDischarged: false,
                    dischargeTimestamp: null

            const savePhysicianOrder = (e) => {
                e.preventDefault();
                if (orderModal.findings.trim() === "" && orderModal.orders.trim() === "") return;

                const patient = patients.find(p => p.id === orderModal.patientId);
                if (!patient) return;

                if (orderModal.editId) {
                    const updatedOrders = patient.physicianOrders.map(o => {
                        if (o.id === orderModal.editId) {
                            const editCount = (o.editCount || 0) + 1;
                            if (editCount > 5) {
                                alert("Maximum edit limit (5 times) reached for this order.");
                                return o;
                            }
                            return {
                                ...o,
                                findings: orderModal.findings.toUpperCase(),
                                orders: orderModal.orders.toUpperCase(),
                                editCount: editCount,
                                lastEdited: new Date().toLocaleString()
                            };
                        }
                        return o;

                    addNotification(`✏️ ${activeUser} edited an order for ${patient.name}.`, orderModal.patientId);

                        date: new Date().toLocaleString(),

                    id: Date.now(),
                    timestamp: now.toLocaleTimeString(),
                    dateStr: currentDateStr,

                    return;
                }
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            const MAX_WIDTH = 800; 
                            const scaleSize = MAX_WIDTH / img.width;
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleSize;
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const base64Img = canvas.toDataURL('image/jpeg', 0.6); 
                            setUploadModal(prev => ({ ...prev, images: [...prev.images, base64Img] }));
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                                    </div>
                                    <div className="flex gap-4 pt-2">
                                        <label className="flex items-center gap-2 font-bold cursor-pointer">
                                            <input name="isPostAmputation" type="checkbox" className="w-4 h-4 rounded text-blue-600" /> BETADINE ALLOWED
                                        </label>
                                    </div>
                                    <div className="pt-3 flex gap-3">
                                        <button type="button" onClick={() => setAddPatientModal(false)} className="flex-1 py-3 rounded-xl font-bold text-sm bg-slate-100 text-slate-600 hover:bg-slate-200 transition">CANCEL</button>
                                        <button type="submit" className="flex-1 py-3 rounded-xl font-bold text-sm bg-blue-600 text-white hover:bg-blue-700 transition shadow-sm">ADMIT PATIENT</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: LOG VITALS */}
                    {vitalsModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[95] flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 uppercase">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-slate-900">📊 LOG VITAL SIGNS</h2>
                                    <button onClick={() => setVitalsModal(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>
                                <p className="text-xs text-slate-500 font-medium">{vitalsModal.name}</p>
                                
                                <form onSubmit={(e) => saveVitals(e, vitalsModal.id)} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs font-bold text-slate-700 mb-1 block">BP (mmHg)</label>
                                            <input name="bp" type="text" placeholder="120/80" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm uppercase font-medium focus:outline-none focus:border-blue-500" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-700 mb-1 block">HR (bpm)</label>
                                            <input name="hr" type="text" placeholder="80" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm uppercase font-medium focus:outline-none focus:border-blue-500" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-700 mb-1 block">RR (cpm)</label>
                                            <input name="rr" type="text" placeholder="20" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm uppercase font-medium focus:outline-none focus:border-blue-500" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-700 mb-1 block">Temp (°C)</label>
                                            <input name="temp" type="text" placeholder="36.5" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm uppercase font-medium focus:outline-none focus:border-blue-500" />
                                        </div>
                                    </div>
                                    <div className="pt-2 flex gap-3">
                                        <button type="button" onClick={() => setVitalsModal(null)} className="flex-1 py-3 rounded-xl font-bold text-sm bg-slate-100 text-slate-600 hover:bg-slate-200 transition">CANCEL</button>
                                        <button type="submit" className="flex-1 py-3 rounded-xl font-bold text-sm bg-blue-600 text-white hover:bg-blue-700 transition shadow-sm">SAVE VITALS</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: LOG CBG */}
                    {cbgModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[95] flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 uppercase">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-slate-900">🩸 LOG CBG</h2>
                                    <button onClick={() => setCbgModal(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>
                                <p className="text-xs text-slate-500 font-medium">{cbgModal.name}</p>
                                
                                <form onSubmit={(e) => saveCbg(e, cbgModal.id)} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-700 mb-1 block">CBG Level (mg/dL)</label>
                                        <input name="cbgVal" type="number" placeholder="110" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm uppercase font-medium focus:outline-none focus:border-blue-500" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-700 mb-1 block">Timing / Schedule</label>
                                        <select name="cbgTiming" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-xs font-medium uppercase focus:outline-none focus:border-blue-500">
                                            {TIMING_ABBRS.map(t => <option key={t} value={t}>{t}</option>)}
                                        </select>
                                    </div>
                                    <div className="pt-2 flex gap-3">
                                        <button type="button" onClick={() => setCbgModal(null)} className="flex-1 py-3 rounded-xl font-bold text-sm bg-slate-100 text-slate-600 hover:bg-slate-200 transition">CANCEL</button>
                                        <button type="submit" className="flex-1 py-3 rounded-xl font-bold text-sm bg-blue-600 text-white hover:bg-blue-700 transition shadow-sm">SAVE CBG</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* POPUP MODAL: VIEW ALL VITALS LOG */}
                    {viewVitalsModal && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[90] flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-3xl max-w-xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden uppercase">
                                <div className="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-900 text-white">
                                    <div>
                                        <h2 className="text-lg font-bold">📊 COMPLETE VITALS LOG</h2>
                                        <p className="text-xs text-slate-400">{viewVitalsModal.name} • {viewVitalsModal.ward}</p>
                                    </div>
                                    <button onClick={() => setViewVitalsModal(null)} className="text-slate-400 hover:text-white font-bold text-xl px-2">✕</button>
                                </div>
                                <div className="p-6 overflow-y-auto flex-1 space-y-3">
                                    {viewVitalsModal.vitalsHistory && viewVitalsModal.vitalsHistory.map(v => (
                                        <div key={v.id} className="p-4 rounded-2xl border border-slate-200 bg-slate-50 text-xs space-y-2 shadow-sm">
                                            <div className="flex justify-between font-bold text-slate-800 border-b border-slate-200 pb-1.5 items-center">
                                                <span className="text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">{v.dateStr} — {v.shift}</span>
                                                <span className="text-slate-400">{v.timestamp}</span>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2 font-medium text-slate-700 pt-1">
                                                <div>BP: <strong className="text-slate-900">{v.bp}</strong></div>
                                                <div>HR: <strong className="text-slate-900">{v.hr} BPM</strong></div>
                                                <div>RR: <strong className="text-slate-900">{v.rr} CPM</strong></div>
                                                <div>Temp: <strong className="text-slate-900">{v.temp}°C</strong></div>
                                            </div>
                                            <div className="text-[10px] text-slate-400 text-right pt-0.5 font-medium">
                                                LOGGED BY: {v.loggedBy}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* POPUP MODAL: VIEW ALL CBG LOG */}
                    {viewCbgModal && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[90] flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-3xl max-w-xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden uppercase">
                                <div className="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-900 text-white">
                                    <div>
                                        <h2 className="text-lg font-bold">🩸 COMPLETE CBG LOG</h2>
                                        <p className="text-xs text-slate-400">{viewCbgModal.name} • {viewCbgModal.ward}</p>
                                    </div>
                                    <button onClick={() => setViewCbgModal(null)} className="text-slate-400 hover:text-white font-bold text-xl px-2">✕</button>
                                </div>
                                <div className="p-6 overflow-y-auto flex-1 space-y-3">
                                    {viewCbgModal.cbgHistory && viewCbgModal.cbgHistory.map(c => (
                                        <div key={c.id} className="p-4 rounded-2xl border border-slate-200 bg-slate-50 text-xs space-y-2 shadow-sm">
                                            <div className="flex justify-between font-bold text-slate-800 border-b border-slate-200 pb-1.5 items-center">
                                                <span className="text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">{c.dateStr} — {c.shift}</span>
                                                <span className="text-slate-400">{c.timestamp}</span>
                                            </div>
                                            <div className="bg-white p-2.5 rounded-xl border border-slate-200 flex justify-between items-center">
                                                <span>CBG LEVEL: <strong className="text-blue-600 font-mono text-sm">{c.cbgVal}</strong></span>
                                                <span className="bg-amber-50 text-amber-700 px-2 py-0.5 rounded font-bold border border-amber-200 text-[11px]">{c.cbgTiming}</span>
                                            </div>
                                            <div className="text-[10px] text-slate-400 text-right pt-0.5 font-medium">
                                                LOGGED BY: {c.loggedBy}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* POPUP MODAL: VIEW ALL PHYSICIAN ORDERS */}
                    {viewOrdersModal && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[90] flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-3xl max-w-xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden uppercase">
                                <div className="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-900 text-white">
                                    <div>
                                        <h2 className="text-lg font-bold">🩺 ALL PHYSICIAN ORDERS</h2>
                                        <p className="text-xs text-slate-400">{viewOrdersModal.name} • {viewOrdersModal.ward}</p>
                                    </div>
                                    <button onClick={() => setViewOrdersModal(null)} className="text-slate-400 hover:text-white font-bold text-xl px-2">✕</button>
                                </div>
                                <div className="p-6 overflow-y-auto flex-1 space-y-4">
                                    {viewOrdersModal.physicianOrders && viewOrdersModal.physicianOrders.map(order => (
                                        <div key={order.id} className={`p-4 rounded-2xl border text-xs shadow-sm space-y-2 ${DOCTOR_COLORS[order.doctorName] || 'bg-slate-50 border-slate-200 text-slate-800'}`}>
                                            <div className="flex justify-between font-bold border-b border-black/10 pb-1.5 items-center">
                                                <span className="text-sm">{order.doctorName}</span>
                                                <div className="flex items-center gap-3">
                                                    <span className="opacity-75">{order.date}</span>
                                                    {userRole === 'doctor' && order.doctorName === activeUser && (
                                                        <div className="flex gap-2">
                                                            {(!order.editCount || order.editCount < 5) && (
                                                                <button onClick={() => { setOrderModal({ patientId: viewOrdersModal.id, findings: order.findings, orders: order.orders, editId: order.id }); setViewOrdersModal(null); }} className="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded font-bold shadow-sm">EDIT</button>
                                                            )}
                                                            <button onClick={() => deletePhysicianOrder(viewOrdersModal.id, order.id)} className="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1 rounded font-bold shadow-sm">DELETE</button>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                            {order.findings && <p><strong className="opacity-75">FINDINGS:</strong> {order.findings}</p>}
                                            {order.orders && <p><strong className="opacity-75">ORDERS/LABS:</strong> {order.orders}</p>}
                                            {order.editCount > 0 && (
                                                <div className="mt-1 text-[10px] italic opacity-75 font-semibold">
                                                    ✏️ EDITED ({order.editCount}/5) — {order.lastEdited}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: ADD / EDIT PHYSICIAN'S ORDER */}
                    {orderModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[95] flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 uppercase">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                        {orderModal.editId ? "✏️ EDIT PHYSICIAN'S ORDER" : "🩺 WRITE PHYSICIAN'S ORDER"}
                                    </h2>
                                    <button onClick={() => setOrderModal(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>
                                <form onSubmit={savePhysicianOrder} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-700 mb-1.5 block">Pertinent Findings</label>
                                        <textarea 
                                            value={orderModal.findings} 
                                            onChange={(e) => setOrderModal({...orderModal, findings: e.target.value})} 
                                            placeholder="ENTER LATEST FINDINGS..."
                                            className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 uppercase font-medium focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 min-h-[90px]"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-700 mb-1.5 block">Physician's Orders / Labs Requested</label>
                                        <textarea 
                                            value={orderModal.orders} 
                                            onChange={(e) => setOrderModal({...orderModal, orders: e.target.value})} 
                                            placeholder="ENTER ORDERS OR LABS..."
                                            className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 uppercase font-medium focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 min-h-[90px]"
                                        />
                                    </div>
                                    <div className="pt-2 flex gap-3">
                                        <button type="button" onClick={() => setOrderModal(null)} className="flex-1 py-3 rounded-xl font-bold text-sm bg-slate-100 text-slate-600 hover:bg-slate-200 transition">CANCEL</button>
                                        <button type="submit" className="flex-1 py-3 rounded-xl font-bold text-sm bg-blue-600 text-white hover:bg-blue-700 transition shadow-sm">
                                            {orderModal.editId ? "UPDATE ORDER" : "SAVE ORDER"}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ACTIVITY LOG MODAL */}
                    {showActivityLog && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[80] flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-2xl max-w-lg w-full max-h-[80vh] flex flex-col shadow-2xl uppercase">
                                <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                                    <h2 className="text-lg font-bold text-slate-900">📋 ACTIVITY & UPDATE LOG</h2>
                                    <button onClick={() => setShowActivityLog(false)} className="text-slate-400 hover:text-slate-600 font-bold px-2 text-lg">✕</button>
                                </div>
                                <div className="p-4 overflow-y-auto flex-1 space-y-3">
                                    {notifications.map(n => (
                                        <div 
                                            key={n.id} 
                                            onClick={() => jumpToPatient(n.patientId)} 
                                            className={`p-3 rounded-lg border text-sm ${n.patientId ? 'bg-white border-slate-200 hover:border-blue-400 hover:shadow-md cursor-pointer transition' : 'bg-slate-50 border-slate-100 text-slate-500'}`}
                                        >
                                            <div className="text-xs text-slate-400 font-bold mb-1">{n.time}</div>
                                            <div className="text-slate-700 font-medium">{n.text}</div>
                                            {n.patientId && <div className="text-xs text-blue-600 font-bold mt-2 flex items-center gap-1">JUMP TO PATIENT ➔</div>}
                                        </div>
                                    ))}
                                    {notifications.length === 0 && <div className="text-center text-slate-400 text-sm py-4">No recent activity.</div>}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MULTI-IMAGE UPLOAD MODAL */}
                    {uploadModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 uppercase">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-slate-900">📸 UPLOAD COD PROOF</h2>
                                    <button onClick={() => setUploadModal(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>
                                <p className="text-xs text-slate-500 font-medium">Add up to 6 images to prove Wound Care completion.</p>
                                <div className="grid grid-cols-3 gap-2">
                                    {uploadModal.images.map((img, idx) => (
                                        <div key={idx} className="relative group aspect-square">
                                            <img src={img} className="w-full h-full object-cover rounded-lg border border-slate-200 shadow-sm" />
                                            <button onClick={() => setUploadModal(prev => ({...prev, images: prev.images.filter((_, i) => i !== idx)}))} className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-md border-2 border-white font-bold">✕</button>
                                        </div>
                                    ))}
                                    {uploadModal.images.length < 6 && (
                                        <label className="border-2 border-dashed border-slate-300 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:text-blue-600 hover:border-blue-400 hover:bg-blue-50 transition cursor-pointer aspect-square bg-slate-50">
                                            <span className="text-2xl font-bold">+</span>
                                            <span className="text-[10px] font-bold mt-1">ADD PHOTO</span>
                                            <input type="file" multiple accept="image/*" className="hidden" onChange={handleFileSelect} />
                                        </label>
                                    )}
                                </div>
                                <div className="pt-4 flex gap-3">
                                    <button onClick={() => setUploadModal(null)} className="flex-1 py-3 rounded-xl font-bold text-sm bg-slate-100 text-slate-600 hover:bg-slate-200 transition">CANCEL</button>
                                    <button onClick={submitCodProof} disabled={uploadModal.images.length === 0} className="flex-1 py-3 rounded-xl font-bold text-sm bg-emerald-600 text-white hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed transition shadow-sm">SUBMIT PROOF</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* IMAGE VIEWER */}
                    {viewImages && viewImages.length > 0 && (
                        <div className="fixed inset-0 bg-slate-900/95 z-[70] flex flex-col items-center justify-center p-4 backdrop-blur-sm" onClick={(e) => { if(e.target === e.currentTarget) setViewImages(null); }}>
                            <button onClick={() => setViewImages(null)} className="fixed top-6 right-6 text-white font-bold text-sm bg-slate-800 hover:bg-slate-700 px-5 py-2.5 rounded-full transition border border-slate-700 shadow-xl z-50">✕ CLOSE PROOF</button>
                            <div className="max-w-4xl w-full flex flex-col items-center gap-6 mt-12">
                                <img src={viewImages[currentImageIndex]} alt={`Proof ${currentImageIndex+1}`} className="max-h-[70vh] w-auto rounded-xl shadow-2xl border-4 border-slate-200 object-contain" />
                                {viewImages.length > 1 && (
                                    <div className="flex items-center gap-6 bg-slate-800/80 px-6 py-3 rounded-full border border-slate-700">
                                        <button onClick={() => setCurrentImageIndex(i => Math.max(0, i - 1))} disabled={currentImageIndex === 0} className="bg-white/20 p-2 rounded-full text-white disabled:opacity-20 hover:bg-white/30 transition">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M15 19l-7-7 7-7"/></svg>
                                        </button>
                                        <span className="text-white font-bold tracking-widest text-sm">{currentImageIndex + 1} / {viewImages.length}</span>
                                        <button onClick={() => setCurrentImageIndex(i => Math.min(viewImages.length - 1, i + 1))} disabled={currentImageIndex === viewImages.length - 1} className="bg-white/20 p-2 rounded-full text-white disabled:opacity-20 hover:bg-white/30 transition">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M9 5l7 7-7 7"/></svg>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
