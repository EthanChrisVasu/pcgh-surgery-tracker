            { id: 13, name: "Eribal, Zandro Ferrer (54/M)", ward: "ISOLATION SURGERY WARD", dx: "Non-healing Wound (L) Thigh, T2 DM", surgery: "", monitor: "VSQ2 | CBG: Q1", cod: "Wet-to-dry (Ask NOD).", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0113", isDiabetic: true, isPostAmputation: false, amputationType: "", codDone: false, codImage: null },
            { id: 14, name: "Quitain, Rodel Badrina (52/M)", ward: "ISOLATION SURGERY WARD", dx: "Non-healing Wound (L) Heel (Note: presence of maggots)", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Third's Solution OD", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0114", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, codImage: null },
            { id: 15, name: "Manlangit, Allan (44/M)", ward: "ISOLATION SURGERY WARD", dx: "Sepsis sec to Decubitus Ulcer Grade IV", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0115", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, codImage: null },
            { id: 16, name: "Caballero, Daniel Seth", ward: "SURGICAL SUITE ROOM", dx: "Fracture, Middle 3rd Humerus (R)", surgery: "", monitor: "VSQ4", cod: "", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0116", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, codImage: null },
            { id: 17, name: "Buenviaje, Nilda Cajipo (69/F)", ward: "CICU", dx: "Diabetic Foot (R)", surgery: "", monitor: "VSQ1 | CBG: TID", cod: "Wet-to-dry with Dakin's Solution OD", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0117", isDiabetic: true, isPostAmputation: false, amputationType: "", codDone: false, codImage: null },
            { id: 18, name: "Lumandez, Pablito Jr.", ward: "CICU", dx: "Diabetic Foot / Wound", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution OD. (Note: Should be done during daytime).", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0118", isDiabetic: true, isPostAmputation: false, amputationType: "", codDone: false, codImage: null },
            { id: 19, name: "Zuniga", ward: "IM WARD", dx: "Sepsis sec to Sacral Ulcers", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution OD", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0119", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, codImage: null },
            { id: 20, name: "Atanante, Jennifer", ward: "IM WARD", dx: "Cellulitis / Wound Care", surgery: "", monitor: "VSQ4", cod: "Hansol Chlorhexidine Gluconate 4% Topical Solution + Bactromed Mupirocin Ointment (2% w/w). (If patient denies, leave open).", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0120", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, codImage: null },
            { id: 21, name: "Garrido", ward: "IM WARD", dx: "Sacral Ulcers", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution OD", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0121", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, codImage: null },
            { id: 22, name: "Ellaso, Eric (56/M)", ward: "IM WARD", dx: "Wound Care", surgery: "", monitor: "VSQ4", cod: "Wet-to-dry with Dakin's Solution OD. (Note: Put 1 wet gauze inside the wound).", location: "In Ward", watcherName: "Family Watcher", watcherPhone: "0917-550-0122", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, codImage: null },
            { id: 23, name: "Castillejos, Draven Mell (2/M)", ward: "PEDIATRIC WARD", dx: "Perianal Cellulitis/Abscess, T/C Sepsis, T/C ALL", surgery: "", monitor: "VSQ4", cod: "Apply Flammazine and wound care BID", location: "In Ward", watcherName: "Parent / Guardian", watcherPhone: "0917-550-0123", isDiabetic: false, isPostAmputation: false, amputationType: "", codDone: false, codImage: null }
        ];

        const DOCTORS = [
            { name: "Dr. Glenn Camaymayan", pin: "1101", title: "Surgery Resident / Consultant" },
            { name: "Dr. Ruby T.", pin: "1102", title: "Surgery Resident / Consultant" },
            { name: "Dr. Osorio", pin: "1103", title: "Surgery Resident / Consultant" }
        ];

        function App() {
            const [patients, setPatients] = useState(INITIAL_PATIENTS);
            const [userRole, setUserRole] = useState("clerk"); 
            const [activeDoctor, setActiveDoctor] = useState(null);
            const [clerkName, setClerkName] = useState("Ethan (Group Leader)");
            const [notifications, setNotifications] = useState([]);
            
            const [showVerifyModal, setShowVerifyModal] = useState(false);
            const [selectedDoctorName, setSelectedDoctorName] = useState(DOCTORS[0].name);
            const [pinInput, setPinInput] = useState("");
            const [showSops, setShowSops] = useState(false);
            const [viewImage, setViewImage] = useState(null);
            const [isOnline, setIsOnline] = useState(false);

            // 🔥 FIREBASE REAL-TIME SYNC 🔥
            useEffect(() => {
                const patientsRef = db.ref('pcgh/patients');
                const notifsRef = db.ref('pcgh/notifications');

                patientsRef.on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        setPatients(snapshot.val());
                    } else {
                        patientsRef.set(INITIAL_PATIENTS);
                    }
                    setIsOnline(true);
                });

                notifsRef.on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        setNotifications(snapshot.val());
                    }
                });

                return () => {
                    patientsRef.off();
                    notifsRef.off();
                };
            }, []);

            const syncPatients = (updaterFn) => {
                setPatients(prev => {
                    const next = updaterFn(prev);
                    db.ref('pcgh/patients').set(next);
                    return next;
                });
            };

            const addNotification = (text) => {
                setNotifications(prev => {
                    const newNotifs = [{ id: Date.now(), text, time: new Date().toLocaleTimeString() }, ...prev.slice(0, 9)];
                    db.ref('pcgh/notifications').set(newNotifs);
                    return newNotifs;
                });
            };

            const handleVerifyDoctor = (e) => {
                e.preventDefault();
                const doc = DOCTORS.find(d => d.name === selectedDoctorName);
                if (doc && doc.pin === pinInput) {
                    setActiveDoctor(doc.name);
                    setUserRole("doctor");
                    setShowVerifyModal(false);
                    setPinInput("");
                    addNotification(`🔓 ${doc.name} logged in as Verified Doctor.`);
                } else {
                    alert("Incorrect Doctor PIN.");
                }
            };

            const updatePatientField = (id, field, value, fieldName) => {
                addNotification(`📝 ${userRole === 'doctor' ? activeDoctor : clerkName} updated ${patients.find(p=>p.id===id).name}'s ${fieldName}.`);
                syncPatients(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
            };

            const updateFieldWithPrompt = (id, field, currentValue, fieldName) => {
                const newValue = prompt(`Doctor's Override - Enter new ${fieldName}:`, currentValue);
                if (newValue !== null && newValue !== currentValue) {
                    updatePatientField(id, field, newValue, fieldName);
                }
            };

            const handleImageUpload = (id, file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 800;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const base64Img = canvas.toDataURL('image/jpeg', 0.6); 

                        const patientName = patients.find(p=>p.id===id).name;
                        addNotification(`📸 ${clerkName} uploaded COD proof and marked it DONE for ${patientName}.`);
                        syncPatients(prev => prev.map(p => p.id === id ? { ...p, codImage: base64Img, codDone: true } : p));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            };

            const toggleLocation = (id, newLoc) => {
                addNotification(`📍 ${patients.find(p=>p.id===id).name} moved to [${newLoc}] by ${userRole === 'doctor' ? activeDoctor : clerkName}.`);
                syncPatients(prev => prev.map(p => p.id === id ? { ...p, location: newLoc } : p));
            };

            const setAmputation = (id, type) => {
                const p = patients.find(pat=>pat.id===id);
                let codText = p.cod;
                if (type) {
                    codText = "Clean closed surgical stump with Povidone-Iodine (Betadine), pat dry, and wrap with dry sterile gauze & elastic bandage OD.";
                }
                addNotification(`🔪 ${p.name} set to ${type || 'No Amputation'}.`);
                
                syncPatients(prev => prev.map(pat => pat.id === id ? { 
                    ...pat, 
                    isPostAmputation: !!type, 
                    amputationType: type, 
                    surgery: type ? `${type} Amputation` : pat.surgery,
                    cod: codText
                } : pat));
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 pb-16">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3 shadow-sm">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-emerald-600 p-2.5 rounded-xl shadow-sm">
                                    <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="text-lg font-bold tracking-tight text-slate-900">PCGH Surgery Ward</h1>
                                        <span className={`text-xs px-2.5 py-1 rounded-full font-bold shadow-sm border ${userRole === 'doctor' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-blue-50 text-blue-700 border-blue-200'}`}>
                                            {userRole === 'doctor' ? `👨‍⚕️ Doctor's Mode (${activeDoctor})` : `📋 Clerk Mode (${clerkName})`}
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-500 font-medium">Real-Time Ward Coordination {isOnline && <span className="text-emerald-500 ml-1">• Cloud Sync Active</span>}</p>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2">
                                {userRole === 'doctor' ? (
                                    <button onClick={() => { setUserRole('clerk'); setActiveDoctor(null); }} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-lg text-xs font-bold transition border border-slate-300">
                                        Switch to Clerk Mode
                                    </button>
                                ) : (
                                    <button onClick={() => setShowVerifyModal(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-xs font-bold shadow-sm transition flex items-center gap-1.5">
                                        🔒 Verify Doctor
                                    </button>
                                )}

                                <button onClick={() => setShowSops(!showSops)} className="bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 px-3.5 py-2 rounded-lg text-xs font-bold transition">
                                    📋 SOPs & Rules
                                </button>
                            </div>
                        </div>
                    </header>

                    {notifications.length > 0 && (
                        <div className="bg-white border-b border-slate-200 px-4 py-2.5 text-xs shadow-sm">
                            <div className="max-w-7xl mx-auto flex items-center gap-3 overflow-x-auto">
                                <span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-bold shrink-0 animate-pulse border border-blue-200">Live Sync</span>
                                <span className="text-slate-600 truncate font-semibold">{notifications[0].time} — {notifications[0].text}</span>
                            </div>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-4 py-6 space-y-8">
                        {showSops && (
                            <div className="bg-white border border-amber-200 rounded-2xl p-6 shadow-md space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-base font-bold text-amber-600 flex items-center gap-2">⚠️ Standard Operating Procedures & Wound Care Rules</h2>
                                    <button onClick={() => setShowSops(false)} className="text-slate-400 hover:text-slate-700 text-sm font-bold">✕ Close</button>
                                </div>
                                <div className="grid md:grid-cols-2 gap-4 text-xs text-slate-600">
                                    <div className="bg-amber-50/50 p-4 rounded-xl border border-amber-100 space-y-2">
                                        <h3 className="font-bold text-slate-800">🚨 Diabetic Foot & Gangrene Protocols</h3>
                                        <p><strong className="text-red-600">NO BETADINE:</strong> Strictly avoid Povidone-Iodine for Diabetic Patients (unless post-amputation closed stump).</p>
                                        <p><strong>Irrigation & Dressing:</strong> Dakin's Solution (1L PNSS + 10cc Hydrogen Peroxide) ➔ Microdacyn Gel Spray ➔ Wet-to-Dry dressing.</p>
                                    </div>
                                    <div className="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100 space-y-2">
                                        <h3 className="font-bold text-slate-800">🔪 Post-Amputation Rule</h3>
                                        <p>For closed amputation stumps (BKA/AKA), <strong className="text-emerald-600">Betadine is permitted</strong> for cleaning the closed surgical line, wrapped with dry sterile gauze and elastic bandage OD.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {["PEDIATRICS SX WARD", "FEMALE SURGERY WARD", "MALE SURGERY WARD", "ENT / OPHTHA WARD", "ISOLATION SURGERY WARD", "SURGICAL SUITE ROOM", "CICU", "IM WARD", "PEDIATRIC WARD"].map(wardName => {
                            const wardPatients = patients.filter(p => p.ward === wardName);
                            if (wardPatients.length === 0) return null;

                            return (
                                <section key={wardName} className="space-y-4">
                                    <div className="flex items-center justify-between border-b border-slate-300 pb-2">
                                        <h2 className="text-sm font-bold uppercase tracking-wider text-slate-800 flex items-center gap-2">
                                            <span>🛏️</span> {wardName}
                                        </h2>
                                        <span className="text-xs bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full font-semibold border border-slate-300">{wardPatients.length} patient{wardPatients.length > 1 ? 's' : ''}</span>
                                    </div>

                                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
                                        {wardPatients.map(patient => (
                                            <div key={patient.id} className={`bg-white border rounded-2xl p-5 shadow-sm space-y-4 transition ${patient.isPostAmputation ? 'border-emerald-300 bg-emerald-50/30' : patient.isDiabetic ? 'border-amber-300 bg-amber-50/20' : 'border-slate-200'}`}>
                                                
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h3 className="font-bold text-lg text-slate-900 leading-tight">{patient.name}</h3>
                                                        <span className="text-xs text-slate-600 font-medium flex items-center mt-1">
                                                            DX: {patient.dx}
                                                            {userRole === 'doctor' && <button onClick={() => updateFieldWithPrompt(patient.id, 'dx', patient.dx, 'Diagnosis')} className="ml-1.5 text-blue-500 hover:text-blue-700">✏️</button>}
                                                        </span>
                                                        {patient.surgery && (
                                                            <div className="text-xs text-slate-600 font-medium mt-0.5 flex items-center">
                                                                SX: {patient.surgery}
                                                                {userRole === 'doctor' && <button onClick={() => updateFieldWithPrompt(patient.id, 'surgery', patient.surgery, 'Surgery')} className="ml-1.5 text-blue-500 hover:text-blue-700">✏️</button>}
                                                            </div>
                                                        )}
                                                    </div>
                                                    <span className={`text-xs px-2.5 py-1 rounded-full font-bold shrink-0 border shadow-sm ${
                                                        patient.location === 'In OR' ? 'bg-red-50 text-red-700 border-red-200 animate-pulse' :
                                                        patient.location.includes('X-Ray') || patient.location.includes('UTZ') || patient.location.includes('CT') ? 'bg-amber-50 text-amber-700 border-amber-200' :
                                                        patient.location === 'Post-Op' ? 'bg-indigo-50 text-indigo-700 border-indigo-200' :
                                                        'bg-emerald-50 text-emerald-700 border-emerald-200'
                                                    }`}>
                                                        📍 {patient.location}
                                                    </span>
                                                </div>

                                                <div className="flex flex-wrap gap-2 text-xs">
                                                    {patient.isPostAmputation ? (
                                                        <span className="bg-emerald-50 text-emerald-700 border border-emerald-300 px-2.5 py-1 rounded-lg font-bold flex items-center gap-1">
                                                            ✅ Betadine Allowed ({patient.amputationType})
                                                        </span>
                                                    ) : patient.isDiabetic ? (
                                                        <span className="bg-red-50 text-red-700 border border-red-300 px-2.5 py-1 rounded-lg font-bold">
                                                            🚨 NO BETADINE (DM Protocol)
                                                        </span>
                                                    ) : null}
                                                </div>

                                                <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-100 space-y-3">
                                                    <div className="flex justify-between items-center text-xs">
                                                        <span className="font-bold text-slate-800">Wound Care / COD</span>
                                                        <span className="text-slate-600 font-semibold flex items-center bg-white px-2 py-1 rounded border border-slate-200 shadow-sm">
                                                            Monitor: {patient.monitor}
                                                            {userRole === 'doctor' && <button onClick={() => updateFieldWithPrompt(patient.id, 'monitor', patient.monitor, 'Monitor Orders')} className="ml-1.5 text-blue-500 hover:text-blue-700">✏️</button>}
                                                        </span>
                                                    </div>
                                                    
                                                    <div className="flex items-start justify-between bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm">
                                                        <p className="text-xs text-slate-700 font-medium flex-1">{patient.cod || "No specific COD instruction."}</p>
                                                        {userRole === 'doctor' && <button onClick={() => updateFieldWithPrompt(patient.id, 'cod', patient.cod, 'Wound Care (COD)')} className="ml-3 text-blue-500 hover:text-blue-700">✏️</button>}
                                                    </div>

                                                    <div className="pt-1">
                                                        {patient.codDone ? (
                                                            <button onClick={() => setViewImage(patient.codImage)} className="w-full bg-emerald-50 text-emerald-700 border border-emerald-200 py-2.5 rounded-lg text-xs font-bold hover:bg-emerald-100 transition shadow-sm">
                                                                ✅ COD Completed (Click to View Proof)
                                                            </button>
                                                        ) : (
                                                            userRole === 'clerk' ? (
                                                                <label className="cursor-pointer w-full bg-white text-blue-600 border border-blue-300 py-2.5 rounded-lg text-xs font-bold hover:bg-blue-50 transition shadow-sm flex items-center justify-center gap-1.5">
                                                                    📸 Upload Proof to Complete COD
                                                                    <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handleImageUpload(patient.id, e.target.files[0])} />
                                                                </label>
                                                            ) : (
                                                                <div className="w-full bg-slate-100 text-slate-500 border border-slate-200 py-2.5 rounded-lg text-xs font-bold text-center">
                                                                    ⏳ Waiting for Clerk to upload COD Proof
                                                                </div>
                                                            )
                                                        )}
                                                    </div>
                                                </div>

                                                <div className="space-y-1.5">
                                                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Surgery / Amputation Type:</label>
                                                    <select 
                                                        value={patient.amputationType || ""} 
                                                        onChange={(e) => setAmputation(patient.id, e.target.value)}
                                                        disabled={userRole !== 'doctor'}
                                                        className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-800 font-medium focus:outline-none focus:border-emerald-500 disabled:opacity-60 disabled:cursor-not-allowed disabled:bg-slate-100"
                                                    >
                                                        <option value="">(Select Surgery / Non-Amputation)</option>
                                                        <option value="BKA">BKA (Below-Knee Amputation)</option>
                                                        <option value="AKA">AKA (Above-Knee Amputation)</option>
                                                        <option value="Ray">Ray Amputation (Digits)</option>
                                                    </select>
                                                </div>

                                                <div className="space-y-2 pt-1">
                                                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Update Location:</label>
                                                    <div className="grid grid-cols-3 gap-1.5">
                                                        {["In Ward", "In OR", "Post-Op", "X-Ray", "UTZ", "CT Scan"].map(loc => (
                                                            <button 
                                                                key={loc}
                                                                onClick={() => toggleLocation(patient.id, loc)}
                                                                className={`py-1.5 px-2 rounded-lg text-[11px] font-bold transition shadow-sm border ${patient.location === loc ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 hover:bg-slate-100 border-slate-300'}`}
                                                            >
                                                                {loc}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div className="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 text-xs mt-2">
                                                    <span className="text-slate-600 font-medium">👤 {patient.watcherName}</span>
                                                    <a href={`tel:${patient.watcherPhone}`} className="text-emerald-600 font-mono font-bold hover:underline">📞 {patient.watcherPhone}</a>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            );
                        })}
                    </main>

                    {viewImage && (
                        <div className="fixed inset-0 bg-slate-900/95 z-[60] flex flex-col items-center justify-center p-4 backdrop-blur-sm">
                            <div className="max-w-2xl w-full relative">
                                <button onClick={() => setViewImage(null)} className="absolute -top-12 right-0 text-white font-bold text-sm bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full transition border border-slate-700 shadow-lg">✕ Close Proof</button>
                                <img src={viewImage} alt="COD Proof" className="w-full rounded-2xl shadow-2xl border-4 border-slate-200" />
                            </div>
                        </div>
                    )}

                    {showVerifyModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-slate-900">🔒 Verified Doctor Login</h2>
                                    <button onClick={() => setShowVerifyModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>
                                <form onSubmit={handleVerifyDoctor} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-700 mb-1.5 block">Select Doctor:</label>
                                        <select 
                                            value={selectedDoctorName} 
                                            onChange={(e) => setSelectedDoctorName(e.target.value)}
                                            className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm text-slate-900 font-medium focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"
                                        >
                                            {DOCTORS.map(d => <option key={d.name} value={d.name}>{d.name} ({d.title})</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-700 mb-1.5 block">Enter 4-Digit Doctor PIN:</label>
                                        <input 
                                            type="password" 
                                            maxLength="4"
                                            value={pinInput} 
                                            onChange={(e) => setPinInput(e.target.value)}
                                            placeholder="••••"
                                            className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm text-slate-900 tracking-widest text-center font-bold focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-sm transition text-sm">
                                        Verify & Login
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
