        function App() {

            const [viewOrdersModal, setViewOrdersModal] = useState(null); 
            
            const [vitalsFreqPrompt, setVitalsFreqPrompt] = useState(null); 
            const [vitalsModal, setVitalsModal] = useState(null); 
            
            const [cbgModal, setCbgModal] = useState(null);       
            const [outputModal, setOutputModal] = useState(null);
            
            const [viewVitalsModal, setViewVitalsModal] = useState(null); 
            const [viewCbgModal, setViewCbgModal] = useState(null);       
            const [viewOutputModal, setViewOutputModal] = useState(null); 
            
            const [addPatientModal, setAddPatientModal] = useState(false);
            
            // AI State and LocalStorage Key Manager
            const [storedApiKey, setStoredApiKey] = useState(localStorage.getItem('gemini_api_key') || "");
            const [isEditingKey, setIsEditingKey] = useState(!localStorage.getItem('gemini_api_key'));
            const [aiEndorsementText, setAiEndorsementText] = useState("");
            const [isAiLoading, setIsAiLoading] = useState(false);

            useEffect(() => {
                const body = document.getElementById('bodyRoot');
                if (theme === 'dark') {
                    body.classList.remove('bg-slate-50', 'text-slate-900');
                    body.classList.add('bg-slate-900', 'text-slate-100');
                } else {
                    body.classList.remove('bg-slate-900', 'text-slate-100');
                    body.classList.add('bg-slate-50', 'text-slate-900');
                }
            }, [theme]);

            useEffect(() => {
                if (!isAuthenticated || !db) return;

                const patientsRef = db.ref('pcgh/patients');
                const notifsRef = db.ref('pcgh/notifications');
                const onlineDocsRef = db.ref('pcgh/onlineDoctors');
                const admissionAlertRef = db.ref('pcgh/latestAdmissionAlert');
                const connectedRef = db.ref('.info/connected');

                patientsRef.on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        let data = snapshot.val();
                        let safeArray = Array.isArray(data) ? data : Object.values(data);
                        
                        const now = Date.now();
                        const cleanedArray = safeArray.filter(Boolean).map(p => {
                            if (p.isDischarged && p.dischargeTimestamp) {
                                const hoursPassed = (now - p.dischargeTimestamp) / (1000 * 60 * 60);
                                if (hoursPassed >= 24) return null; 
                            }
                            if (!p.urineOutputHistory) p.urineOutputHistory = [];
                            if (!p.jpDrainHistory) p.jpDrainHistory = [];
                            if (!p.labImages) p.labImages = [];
                            return p;
                        }).filter(Boolean);

                        setPatients(cleanedArray);
                    } else {
                        patientsRef.set(INITIAL_PATIENTS);
                    }
                    setIsOnline(true);
                });

                notifsRef.on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        let notifData = snapshot.val();
                        let safeNotifs = Array.isArray(notifData) ? notifData : Object.values(notifData);
                        setNotifications(safeNotifs.filter(Boolean));
                    }
                });

                onlineDocsRef.on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        const list = Object.values(data).filter(Boolean);
                        setOnlineDoctors(list);
                    } else {
                        setOnlineDoctors([]);
                    }
                });

                if (userRole === 'doctor') {
                    const docKey = activeUser.replace(/[.#$/[\]\s✔️]/g, '_');
                    const myPresenceRef = db.ref(`pcgh/onlineDoctors/${docKey}`);
                    activePresenceRef.current = myPresenceRef;

                    connectedRef.on('value', (snap) => {
                        if (snap.val() === true) {
                            myPresenceRef.onDisconnect().remove();
                            myPresenceRef.set({
                                name: activeUser.replace(' ✔️', ''),
                                loginTime: get12HourTime(),
                                timestamp: Date.now()
                            });
                        }
                    });
                }

                admissionAlertRef.on('value', (snapshot) => {
                    if (snapshot.exists() && userRole === 'doctor') {
                        const alertData = snapshot.val();
                        if (alertData && alertData.timestamp > sessionStartTimeRef.current) {
                            setLiveDoctorAlert(alertData);
                        }
                    }
                });

                return () => {
                    patientsRef.off();
                    notifsRef.off();
                    onlineDocsRef.off();
                    admissionAlertRef.off();
                    connectedRef.off();
                    if (activePresenceRef.current) {
                        activePresenceRef.current.remove();
                        activePresenceRef.current = null;
                    }
                };
            }, [isAuthenticated, userRole, activeUser]);

            const syncPatients = (updaterFn) => {
                setPatients(prev => {
                    const next = updaterFn(prev);
                    if (db) db.ref('pcgh/patients').set(next);
                    return next;
                });
            };

            const addNotification = (text, patientId = null) => {
                let cleanText = text.replace(/Dr\.\s*Dr\./g, 'Dr.');
                setNotifications(prev => {
                    const newNotifs = [{ id: Date.now(), text: cleanText, time: get12HourTime(), patientId }, ...prev.slice(0, 39)];
                    if (db) db.ref('pcgh/notifications').set(newNotifs);
                    return newNotifs;
                });
            };

            const handleClerkLogin = (e) => {
                e.preventDefault();
                if (clerkNameInput.trim() === "") return alert("Please enter your name.");
                const formattedName = `${clerkNameInput}${clerkIdInput ? ` (${clerkIdInput})` : ''} - ${clerkShift} Shift`;
                
                setTheme(clerkShift === 'PM' ? 'dark' : 'light');
                sessionStartTimeRef.current = Date.now();
                setActiveUser(formattedName);
                setUserRole("clerk");
                setIsAuthenticated(true);
                setShowVersionModal(true); 
            };

            const handleDoctorLogin = (e) => {
                e.preventDefault();
                const doc = DOCTORS.find(d => d.name === selectedDoctorName);
                if (doc && doc.pin === doctorPinInput) {
                    const cleanDocName = doc.name.replace(/^Dr\.\s*/, '');
                    setTheme('light'); 
                    sessionStartTimeRef.current = Date.now();
                    setActiveUser(`Dr. ${cleanDocName}`);
                    setUserRole("doctor");
                    setIsAuthenticated(true);
                    setDoctorPinInput("");
                    setShowVersionModal(true); 
                } else {
                    alert("Incorrect Doctor PIN.");
                }
            };

            const handleLogout = () => {
                if (activePresenceRef.current) {
                    activePresenceRef.current.remove();
                    activePresenceRef.current = null;
                }
                setIsAuthenticated(false);
                setUserRole(null);
                setActiveUser("");
                setIsOnline(false);
                setTheme('light');
            };

            const handleDailyReset = () => {
                if (window.confirm("🚨 Reset all COD statuses, images, vitals, CBG, and output logs for a new day? Patient orders remain safe.")) {
                    syncPatients(prev => prev.map(p => ({ ...p, codDone: false, codImages: [], vitalsHistory: [], cbgHistory: [], urineOutputHistory: [], jpDrainHistory: [] })));
                    addNotification(`🌅 ${activeUser} performed a New Day Reset.`);
                }
            };

            const jumpToPatient = (patientId) => {
                if (!patientId) return;
                setShowActivityLog(false);
                setLiveDoctorAlert(null);
                setHighlightedPatient(patientId);
                setTimeout(() => setHighlightedPatient(null), 4000);
                const el = document.getElementById('patient-' + patientId);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            };

            const updatePatientField = (id, field, value, fieldName) => {
                const targetPatient = patients.find(p => p.id === id);
                if (!targetPatient) return;
                addNotification(`📝 ${activeUser} updated ${targetPatient.name}'s ${fieldName}.`, id);
                syncPatients(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
            };

            const updateFieldWithPrompt = (id, field, currentValue, fieldName) => {
                const newValue = prompt(`Doctor's Override - Enter new ${fieldName}:`, currentValue);
                if (newValue !== null && newValue !== currentValue) {
                    updatePatientField(id, field, newValue, fieldName);
                }
            };

            const editWatcher = (id) => {
                const p = patients.find(pat => pat.id === id);
                if (!p) return;
                const newName = prompt("Enter Watcher / Guardian Name:", p.watcherName || "Family Watcher");
                if (newName === null) return;
                const newPhone = prompt("Enter Watcher / Guardian Phone Number:", p.watcherPhone || "0917-000-0000");
                if (newPhone === null) return;

                addNotification(`👤 ${activeUser} updated Watcher details for ${p.name}.`, id);
                syncPatients(prev => prev.map(pat => pat.id === id ? { ...pat, watcherName: newName.toUpperCase(), watcherPhone: newPhone } : pat));
            };

            const updateWoundCareProtocol = (id, protocolType, timingAbbr) => {
                const p = patients.find(pat => pat.id === id);
                if (!p) return;
                let baseText = "";
                if (protocolType === 'BETADINE') baseText = "DRY WITH BETADINE";
                else if (protocolType === 'DAKINS') baseText = "WET-TO-DRY WITH DAKIN'S SOLUTION";
                else if (protocolType === 'THIRDS') baseText = "WET-TO-DRY WITH THIRD'S SOLUTION";
                const finalCod = `${baseText} ${timingAbbr}`;
                addNotification(`⚕️ ${activeUser} updated Wound Care to [${finalCod}] for ${p.name}.`, id);
                syncPatients(prev => prev.map(pat => pat.id === id ? { ...pat, cod: finalCod, codTiming: timingAbbr } : pat));
            };

            const updateCustomWoundCare = (id, newText) => {
                const p = patients.find(pat => pat.id === id);
                if (!p) return;
                addNotification(`⚕️ ${activeUser} updated Wound Care Instructions for ${p.name}.`, id);
                syncPatients(prev => prev.map(pat => pat.id === id ? { ...pat, cod: newText.toUpperCase() } : pat));
            };

            const toggleBetadineAllowance = (id) => {
                const p = patients.find(pat => pat.id === id);
                if (!p) return;
                addNotification(`⚕️ ${activeUser} toggled Betadine Allowance ${!p.isPostAmputation ? 'ALLOWED' : 'RESTRICTED'} for ${p.name}.`, id);
                syncPatients(prev => prev.map(pat => pat.id === id ? { ...pat, isPostAmputation: !p.isPostAmputation } : pat));
            };

            const toggleNeedsWoundCare = (id) => {
                const p = patients.find(pat => pat.id === id);
                if (!p) return;
                addNotification(`⚕️ ${activeUser} toggled Wound Care status for ${p.name}.`, id);
                syncPatients(prev => prev.map(pat => pat.id === id ? { ...pat, needsWoundCare: !(p.needsWoundCare !== false) } : pat));
            };

            // ==========================================
            // GEMINI AI EXTRACTOR
            // ==========================================
            const saveApiKeyLocally = () => {
                const inputKey = document.getElementById("apiKeyInput").value.trim();
                if (!inputKey.startsWith("AIza")) {
                    alert("⚠️ Invalid API Key. Gemini API keys must start with 'AIza'. Check Google AI Studio again.");
                    return;
                }
                localStorage.setItem('gemini_api_key', inputKey);
                setStoredApiKey(inputKey);
                setIsEditingKey(false);
            };

            const handleAiExtraction = async () => {
                if (!aiEndorsementText.trim()) return alert("Please paste an endorsement first.");
                if (!storedApiKey) return alert("Please save your API key first.");

                setIsAiLoading(true);
                try {
                    const prompt = `
                    You are a strict medical data extraction assistant for Pasay City General Hospital. 
                    Extract the patient details from the following raw endorsement text.
                    Return ONLY a raw JSON object (no markdown, no backticks, no extra text) with these EXACT keys and format:
                    {
                      "name": "LASTNAME, FIRSTNAME (AGE/SEX) - MUST BE FULLY UPPERCASE",
                      "ward": "Guess from context: FEMALE SURGERY WARD, MALE SURGERY WARD, IM WARD, ISOLATION SURGERY WARD, PEDIATRICS SX WARD",
                      "dx": "The exact diagnosis, FULLY UPPERCASE",
                      "monitor": "VSQ4 (default unless specified)",
                      "cod": "Wound care instructions. If diabetic/gangrene put 'WET-TO-DRY WITH DAKIN'S SOLUTION OD'. Otherwise 'DRY WITH BETADINE OD'"
                    }
                    Endorsement text to parse: "${aiEndorsementText}"
                    `;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${storedApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });

                    const data = await response.json();
                    
                    if (data.error) throw new Error(data.error.message);
                    if (!data.candidates) throw new Error("Invalid response. Key might be restricted or deleted.");
                    
                    let aiResultText = data.candidates[0].content.parts[0].text.trim();
                    if (aiResultText.startsWith('```json')) {
                        aiResultText = aiResultText.replace(/```json\n?/, '').replace(/```$/, '');
                    }

                    const extractedData = JSON.parse(aiResultText);
                    const form = document.getElementById('addPatientForm');
                    
                    if (form && extractedData) {
                        form.patientName.value = extractedData.name || "";
                        if (extractedData.ward && WARD_LIST.includes(extractedData.ward.toUpperCase())) {
                            form.patientWard.value = extractedData.ward.toUpperCase();
                        }
                        form.patientDx.value = extractedData.dx || "";
                        if(extractedData.monitor) form.patientMonitor.value = extractedData.monitor;
                        
                        form.codProtocol.value = 'CUSTOM';
                        document.getElementById('addCustomCodBox').style.display = 'block';
                        form.customCod.value = extractedData.cod || "";
                        
                        setAiEndorsementText("");
                        alert(`✅ AI Extraction Successful! Form auto-filled for: ${extractedData.name}`);
                    }
                } catch (error) {
                    console.error("AI Extraction Error:", error);
                    alert(`Failed to parse endorsement.\nReason: ${error.message}`);
                } finally {
                    setIsAiLoading(false);
                }
            };

            const handleAddPatientSubmit = (e) => {
                e.preventDefault();
                const form = e.target;
                
                let finalCod = "";
                if (form.codProtocol.value === 'CUSTOM') {
                    finalCod = form.customCod.value.toUpperCase();
                } else {
                    finalCod = `${form.codProtocol.value} ${form.codTiming.value}`;
                }

                const newPatient = {
                    id: Date.now(),
                    name: form.patientName.value.toUpperCase(),
                    ward: form.patientWard.value,
                    room: form.patientWard.value.includes('ISOLATION') || form.patientWard.includes('IM') ? form.patientRoom.value : '',
                    dx: form.patientDx.value.toUpperCase(),
                    surgery: form.patientSurgery.value ? form.patientSurgery.value.toUpperCase() : '',
                    monitor: form.patientMonitor.value.toUpperCase() || 'VSQ4',
                    cod: finalCod,
                    codTiming: form.codTiming.value,
                    location: '',
                    watcherName: form.watcherName.value.toUpperCase() || 'FAMILY WATCHER',
                    watcherPhone: form.watcherPhone.value || '0917-550-0000',
                    isPostAmputation: form.isPostAmputation.checked,
                    ...COMMON_FIELDS
                };

                const onlineDocNames = onlineDoctors.map(d => d.name).join(', ');
                const docNotifSuffix = onlineDoctors.length > 0 
                    ? ` (Auto-messaged live doctor${onlineDoctors.length > 1 ? 's' : ''}: ${onlineDocNames})` 
                    : '';

                addNotification(`➕ ${activeUser} admitted new patient: ${newPatient.name} to ${newPatient.ward}${docNotifSuffix}.`, newPatient.id);
                syncPatients(prev => [newPatient, ...prev]);

                if (db) {
                    db.ref('pcgh/latestAdmissionAlert').set({
                        id: Date.now(),
                        timestamp: Date.now(),
                        timeStr: get12HourTime(),
                        admittedBy: activeUser,
                        patientId: newPatient.id,
                        patientName: newPatient.name,
                        ward: newPatient.ward,
                        dx: newPatient.dx,
                        monitor: newPatient.monitor,
                        cod: newPatient.cod
                    });
                }
                setAddPatientModal(false);
            };

            const savePhysicianOrder = (e) => {
                e.preventDefault();
                if (orderModal.findings.trim() === "" && orderModal.orders.trim() === "") return;

                const patient = patients.find(p => p.id === orderModal.patientId);
                if (!patient) return;

                    const updatedOrders = patient.physicianOrders.map(o => {
                        if (o.id === orderModal.editId) {
                            const editCount = (o.editCount || 0) + 1;
                            if (editCount > 5) {
                                alert("Maximum edit limit (5 times) reached for this order.");
                                return o;
                            }
                            return { ...o, findings: orderModal.findings.toUpperCase(), orders: orderModal.orders.toUpperCase(), editCount: editCount, lastEdited: new Date().toLocaleString() };
                        }
                        return o;
                    });
                    addNotification(`✏️ ${activeUser} edited an order for ${patient.name}.`, orderModal.patientId);
                    syncPatients(prev => prev.map(p => p.id === orderModal.patientId ? { ...p, physicianOrders: updatedOrders } : p));
                } else {
                    const newOrder = { id: Date.now(), date: new Date().toLocaleString(), doctorName: activeUser, findings: orderModal.findings.toUpperCase(), orders: orderModal.orders.toUpperCase(), editCount: 0, lastEdited: null };
                    addNotification(`🩺 ${activeUser} added Physician's Orders for ${patient.name}.`, orderModal.patientId);
                    syncPatients(prev => prev.map(p => p.id === orderModal.patientId ? { ...p, physicianOrders: [newOrder, ...(p.physicianOrders || [])] } : p));
                }
                setOrderModal(null);
            };

            const deletePhysicianOrder = (patientId, orderId) => {
                if (window.confirm("Are you sure you want to delete this order?")) {
                    syncPatients(prev => prev.map(p => p.id === patientId ? { ...p, physicianOrders: p.physicianOrders.filter(o => o.id !== orderId) } : p));
                    addNotification(`🗑️ ${activeUser} removed a physician order.`, patientId);

            const saveVitals = (e) => {

                const isAMShift = now.getHours() >= 7 && now.getHours() < 19;
                const shiftName = isAMShift ? "AM SHIFT (07:00 AM - 07:00 PM)" : "PM SHIFT (07:00 PM - 07:00 AM)";
                const currentDateStr = now.toLocaleDateString(); 

                const newVitals = {

                    timestamp: get12HourTime(), 
                    dateStr: currentDateStr, 
                    shift: shiftName, 
                    loggedBy: activeUser, 
                    bp: form.bp.value || 'N/A', 
                    hr: form.hr.value || 'N/A', 
                    rr: form.rr.value || 'N/A', 
                    temp: form.temp.value || 'N/A', 
                    spo2: form.spo2.value || 'N/A',

                addNotification(`📊 ${activeUser} logged Vitals for ${patients.find(p=>p.id===vitalsModal.id)?.name}.`, vitalsModal.id);
                syncPatients(prev => prev.map(p => p.id === vitalsModal.id ? { ...p, vitalsHistory: [newVitals, ...(p.vitalsHistory || [])] } : p));
                setVitalsModal(null);
            };

            const saveCbg = (e, patientId) => {
                e.preventDefault();
                const form = e.target;
                const now = new Date();
                const isAMShift = now.getHours() >= 7 && now.getHours() < 19;

                const newCbg = { id: Date.now(), timestamp: get12HourTime(), dateStr: now.toLocaleDateString(), shift: shiftName, loggedBy: activeUser, cbgVal: form.cbgVal.value ? `${form.cbgVal.value} MG/DL` : 'N/A', cbgTiming: form.cbgTiming.value.toUpperCase() };
                addNotification(`🩸 ${activeUser} logged CBG for ${patients.find(p=>p.id===patientId)?.name}.`, patientId);
                syncPatients(prev => prev.map(p => p.id === patientId ? { ...p, cbgHistory: [newCbg, ...(p.cbgHistory || [])] } : p));
                setCbgModal(null);
            };
            
            const saveOutput = (e, patientId) => {
                e.preventDefault();
                const form = e.target;
                const now = new Date();
                const isAMShift = now.getHours() >= 7 && now.getHours() < 19;

                const newOutput = { id: Date.now(), timestamp: get12HourTime(), dateStr: now.toLocaleDateString(), shift: shiftName, loggedBy: activeUser, volume: form.volume.value ? `${form.volume.value} mL` : 'N/A', type: outputModal.type, desc: form.desc.value || '' };
                addNotification(`💧 ${activeUser} logged ${outputModal.type} for ${patients.find(p=>p.id===patientId)?.name}.`, patientId);
                
                syncPatients(prev => prev.map(p => {
                    if (p.id === patientId) {
                        if (outputModal.type === 'Urine') return { ...p, urineOutputHistory: [newOutput, ...(p.urineOutputHistory || [])] };
                        if (outputModal.type === 'JP Drain') return { ...p, jpDrainHistory: [newOutput, ...(p.jpDrainHistory || [])] };
                    }
                    return p;
                }));
                setOutputModal(null);
            };

            const toggleDischarge = (id) => {
                const targetPatient = patients.find(p => p.id === id);
                if (!targetPatient) return;
                const newStatus = !targetPatient.isDischarged;
                if (newStatus) {
                    if (!window.confirm(`⚠️ Mark ${targetPatient.name} as Discharged (MGH)?\n\nCard auto-archives in 24 hrs, or click "Remove Card Instantly".`)) return;
                }
                const timestamp = newStatus ? Date.now() : null;
                addNotification(`🏥 ${activeUser} marked ${targetPatient.name} as ${newStatus ? 'DISCHARGED (MGH)' : 'READMITTED'}.`, id);
                syncPatients(prev => prev.map(p => p.id === id ? { ...p, isDischarged: newStatus, dischargeTimestamp: timestamp } : p));
            };

            const removePatientInstantly = (id) => {
                const targetPatient = patients.find(p => p.id === id);
                if (!targetPatient) return;
                if (window.confirm(`🗑️ INSTANT REMOVAL: Permanently remove ${targetPatient.name} right now?`)) {
                    addNotification(`🗑️ ${activeUser} permanently removed ${targetPatient.name}.`);
                    syncPatients(prev => prev.filter(p => p.id !== id));
                }
            };

            const handleImageSelect = (e, modalState, setModalStateFn) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                if (modalState.images.length + files.length > 6) return alert("Maximum 6 images allowed per upload.");
                
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            const scaleSize = 1000 / img.width; 
                            canvas.width = 1000; 
                            canvas.height = img.height * scaleSize;
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            setModalStateFn(prev => ({ ...prev, images: [...prev.images, canvas.toDataURL('image/jpeg', 0.7)] }));
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const submitCodProof = () => {
                if (uploadCodModal.images.length === 0) return alert("Please add at least one image.");
                addNotification(`📸 ${activeUser} uploaded COD proof for ${patients.find(p=>p.id===uploadCodModal.patientId)?.name}.`, uploadCodModal.patientId);
                syncPatients(prev => prev.map(p => p.id === uploadCodModal.patientId ? { ...p, codImages: uploadCodModal.images, codDone: true } : p));
                setUploadCodModal(null);
            };

            const submitLabProof = () => {
                if (uploadLabModal.images.length === 0) return alert("Please add at least one image.");
                addNotification(`🩻 ${activeUser} uploaded X-Ray/Labs for ${patients.find(p=>p.id===uploadLabModal.patientId)?.name}.`, uploadLabModal.patientId);
                syncPatients(prev => prev.map(p => p.id === uploadLabModal.patientId ? { ...p, labImages: [...(p.labImages || []), ...uploadLabModal.images] } : p));
                setUploadLabModal(null);
            };

            const clearLabImages = (patientId) => {
                if(window.confirm("Are you sure you want to clear all X-Rays and Labs for this patient?")) {
                    syncPatients(prev => prev.map(p => p.id === patientId ? { ...p, labImages: [] } : p));
                    addNotification(`🗑️ ${activeUser} cleared X-Ray/Lab gallery for a patient.`, patientId);
                }
            };

            const toggleLocation = (id, newLoc) => {
                const targetPatient = patients.find(p => p.id === id);
                if (!targetPatient) return;
                const finalLoc = (targetPatient.location === newLoc) ? "" : newLoc;
                if(finalLoc !== "") {
                    addNotification(`📍 ${activeUser} tagged ${targetPatient.name} as [${finalLoc}].`, id);
                }
                syncPatients(prev => prev.map(p => p.id === id ? { ...p, location: finalLoc } : p));
            };

            // ==========================================
            // THEME CSS CLASSES
            // ==========================================
            const isDark = theme === 'dark';
            const cardBgClass = isDark ? 'bg-slate-800 border-slate-700 shadow-none' : 'bg-white border-slate-200 shadow-sm';
            const textMainClass = isDark ? 'text-slate-100' : 'text-slate-900';
            const textMutedClass = isDark ? 'text-slate-400' : 'text-slate-600';
            const headerBgClass = isDark ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200';
            const modalBgClass = isDark ? 'bg-slate-800 border-slate-700 shadow-[0_0_40px_rgba(0,0,0,0.5)]' : 'bg-white border-slate-200 shadow-2xl';
            const subPanelClass = isDark ? 'bg-slate-700/50 border-slate-600' : 'bg-slate-100/70 border-slate-200';
            const inputBgClass = isDark ? 'bg-slate-700 border-slate-600 text-white' : 'bg-slate-50 border-slate-300 text-slate-900';
            const specialBoxClass = isDark ? 'bg-blue-900/30 border-blue-800 text-blue-100' : 'bg-blue-50/50 border-blue-100 text-slate-800';
            
            // ==========================================
            // RENDER: LOGIN GATEWAY
            // ==========================================
            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4" style={{backgroundImage: 'url("[https://www.transparenttextures.com/patterns/cubes.png](https://www.transparenttextures.com/patterns/cubes.png)")'}}>
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden z-10">
                            <div className="bg-slate-900 p-8 text-center space-y-3">
                                <div className="mx-auto bg-emerald-500 w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg">
                                    <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                                </div>
                                <h1 className="text-xl font-bold tracking-tight text-white">PCGH Surgery Ward</h1>
                                <p className="text-sm text-slate-400 font-medium">Real-Time Tracker Access Portal</p>

                            <div className="flex border-b border-slate-200">
                                <button type="button" onClick={() => setLoginTab('clerk')} className={`flex-1 py-4 text-sm font-bold transition ${loginTab === 'clerk' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50/50' : 'text-slate-500 hover:bg-slate-50'}`}>📋 Clerk Login</button>
                                <button type="button" onClick={() => setLoginTab('doctor')} className={`flex-1 py-4 text-sm font-bold transition ${loginTab === 'doctor' ? 'text-emerald-600 border-b-2 border-emerald-600 bg-emerald-50/50' : 'text-slate-500 hover:bg-slate-50'}`}>👨‍⚕️ Doctor Login</button>

                            <div className="p-8">
                                <div className={loginTab === 'clerk' ? 'block' : 'hidden'}>
                                    <form onSubmit={handleClerkLogin} className="space-y-5">
                                        <div>

                                            <input type="text" required value={clerkNameInput} onChange={(e) => setClerkNameInput(e.target.value)} placeholder="e.g., Ethan" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 font-medium focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />

                                            <input type="text" value={clerkIdInput} onChange={(e) => setClerkIdInput(e.target.value)} placeholder="e.g., Group Leader, AMA" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 font-medium focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />

                                            <select value={selectedDoctorName} onChange={(e) => setSelectedDoctorName(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 font-medium focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                                                {DOCTORS.map(d => <option key={d.name} value={d.name}>{d.name} ☑️</option>)}

                                        </div>

                                            Authenticate and Enter

                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // RENDER: MAIN WARD TRACKER 
            // ==========================================
            return (
                <div className={`min-h-screen pb-16 ${isDark ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
                    
                    <header className={`sticky top-0 z-[9000] px-4 py-3 shadow-sm border-b ${headerBgClass} transition-colors duration-500`}>
                        <div className="max-w-[1400px] mx-auto flex flex-col gap-3">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">

                                            />
                                            <button 
                                                onClick={saveApiKeyLocally}
                                                className="cursor-pointer w-full py-2 rounded-lg font-bold text-xs bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm"
                                            >
                                                SAVE API KEY
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="space-y-2">
                                            <textarea 
                                                value={aiEndorsementText}
                                                onChange={(e) => setAiEndorsementText(e.target.value)}
                                                placeholder="Paste messy Viber endorsement text here..."
                                                className={`w-full rounded-lg px-3 py-2 text-xs font-mono focus:outline-none focus:ring-1 focus:ring-blue-500 border ${isDark ? 'bg-blue-900/40 border-blue-700 text-blue-100 placeholder-blue-400/50' : 'bg-white border-blue-200 text-blue-900 placeholder-blue-300'}`}
                                                rows="3"
                                            ></textarea>
                                            <button 
                                                type="button" 
                                                onClick={handleAiExtraction}
                                                disabled={isAiLoading || !aiEndorsementText.trim()}
                                                className={`cursor-pointer w-full py-2 rounded-lg font-bold text-xs transition uppercase ${isAiLoading ? 'bg-blue-400 cursor-wait' : 'bg-blue-600 hover:bg-blue-700 text-white shadow-sm'}`}
                                            >
                                                {isAiLoading ? "Extracting Data..." : "Extract & Fill Form"}
                                            </button>
                                        </div>
                                    )}
                                </div>
                                
                                <form id="addPatientForm" onSubmit={handleAddPatientSubmit} className="space-y-4 text-xs uppercase pt-2">
                                    <div>
                                        <label className={`font-bold mb-1 block ${textMutedClass}`}>Patient Name & Age/Gender</label>
                                        <input name="patientName" required type="text" placeholder="e.g., DELA CRUZ, JUAN (45/M)" className={`w-full rounded-xl px-3 py-2.5 text-sm font-medium uppercase focus:outline-none focus:ring-1 focus:ring-blue-500 ${inputBgClass}`} />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className={`font-bold mb-1 block ${textMutedClass}`}>Assign Ward</label>
                                            <select name="patientWard" onChange={(e) => {
                                                const roomBox = document.getElementById('roomBox');
                                                if (e.target.value.includes('ISOLATION') || e.target.value.includes('IM')) roomBox.style.display = 'block';
                                                else roomBox.style.display = 'none';
                                            }} className={`w-full rounded-xl px-3 py-2.5 text-xs font-medium uppercase focus:outline-none focus:ring-1 focus:ring-blue-500 ${inputBgClass}`}>
                                                {WARD_LIST.map(w => <option key={w} value={w}>{w}</option>)}
                                            </select>
                                        </div>
                                        <div id="roomBox" style={{display: 'none'}}>
                                            <label className={`font-bold mb-1 block ${textMutedClass}`}>Room / Bed Number</label>
                                            <input name="patientRoom" type="text" placeholder="e.g. MW-1" className={`w-full rounded-xl px-3 py-2.5 text-xs font-medium uppercase focus:outline-none focus:ring-1 focus:ring-blue-500 ${inputBgClass}`} />
                                        </div>
                                    </div>
                                    <div>
                                        <label className={`font-bold mb-1 block ${textMutedClass}`}>Diagnosis (DX)</label>
                                        <input name="patientDx" required type="text" placeholder="e.g., ACUTE APPENDICITIS" className={`w-full rounded-xl px-3 py-2.5 text-sm font-medium uppercase focus:outline-none focus:ring-1 focus:ring-blue-500 ${inputBgClass}`} />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className={`font-bold mb-1 block ${textMutedClass}`}>Surgery (Optional)</label>
                                            <input name="patientSurgery" type="text" placeholder="e.g., APPENDECTOMY" className={`w-full rounded-xl px-3 py-2.5 text-sm font-medium uppercase focus:outline-none focus:ring-1 focus:ring-blue-500 ${inputBgClass}`} />
                                        </div>
                                        <div>
                                            <label className={`font-bold mb-1 block ${textMutedClass}`}>Monitor Schedule</label>
                                            <input name="patientMonitor" type="text" defaultValue="VSQ4" className={`w-full rounded-xl px-3 py-2.5 text-sm font-medium uppercase focus:outline-none focus:ring-1 focus:ring-blue-500 ${inputBgClass}`} />
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className={`font-bold mb-1 block ${textMutedClass}`}>Special Wound Care Instructions</label>
                                            <select name="codProtocol" onChange={(e) => {
                                                const customBox = document.getElementById('addCustomCodBox');
                                                if(e.target.value === 'CUSTOM') customBox.style.display = 'block';
                                                else customBox.style.display = 'none';
                                            }} className={`w-full rounded-xl px-3 py-2.5 text-xs font-medium uppercase focus:outline-none focus:ring-1 focus:ring-blue-500 ${inputBgClass}`}>
                                                <option value="WET-TO-DRY WITH DAKIN'S SOLUTION">Dakin's Solution</option>
                                                <option value="DRY WITH BETADINE">Betadine OD</option>
                                                <option value="WET-TO-DRY WITH THIRD'S SOLUTION">Third's Solution</option>
                                                <option value="CUSTOM">Custom Free-Text</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className={`font-bold mb-1 block ${textMutedClass}`}>Timing Abbreviation</label>
                                            <select name="codTiming" defaultValue="OD" className={`w-full rounded-xl px-3 py-2.5 text-xs font-medium uppercase focus:outline-none focus:ring-1 focus:ring-blue-500 ${inputBgClass}`}>
                                                {TIMING_ABBRS.map(t => <option key={t} value={t}>{t}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div id="addCustomCodBox" style={{display: 'none'}}>
                                        <label className={`font-bold mb-1 block ${textMutedClass}`}>Custom Protocol Instruction</label>
                                        <input name="customCod" type="text" placeholder="ENTER CUSTOM WOUND CARE..." className={`w-full rounded-xl px-3 py-2.5 text-sm font-medium uppercase focus:outline-none focus:ring-1 focus:ring-blue-500 ${inputBgClass}`} />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className={`font-bold mb-1 block ${textMutedClass}`}>Watcher Name</label>
                                            <input name="watcherName" type="text" defaultValue="FAMILY WATCHER" className={`w-full rounded-xl px-3 py-2.5 text-sm font-medium uppercase focus:outline-none focus:ring-1 focus:ring-blue-500 ${inputBgClass}`} />
                                        </div>
                                        <div>
                                            <label className={`font-bold mb-1 block ${textMutedClass}`}>Watcher Phone</label>
                                            <input name="watcherPhone" type="text" defaultValue="0917-550-0000" className={`w-full rounded-xl px-3 py-2.5 text-sm font-medium uppercase focus:outline-none focus:ring-1 focus:ring-blue-500 ${inputBgClass}`} />
                                        </div>
                                    </div>
                                    <div className="flex gap-4 pt-2">
                                        <label className={`flex items-center gap-2 font-bold cursor-pointer ${textMainClass}`}>
                                            <input name="isPostAmputation" type="checkbox" className="w-4 h-4 rounded text-blue-600" /> BETADINE ALLOWED (Post-Op/Closed)
                                        </label>
                                    </div>
                                    <div className="pt-3 flex gap-3">
                                        <button type="button" onClick={() => setAddPatientModal(false)} className={`cursor-pointer flex-1 py-3 rounded-xl font-bold text-sm transition ${isDark ? 'bg-slate-700 text-white hover:bg-slate-600' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>CANCEL</button>
                                        <button type="submit" className="cursor-pointer flex-1 py-3 rounded-xl font-bold text-sm bg-blue-600 text-white hover:bg-blue-700 transition shadow-sm">ADMIT PATIENT</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    {showActivityLog && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[99999] flex items-center justify-center p-4">
                            <div className={`${modalBgClass} border rounded-2xl max-w-lg w-full max-h-[80vh] flex flex-col uppercase overflow-hidden`}>
                                <div className={`p-4 border-b flex justify-between items-center ${isDark ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                                    <h2 className={`text-lg font-bold ${textMainClass}`}>📋 ACTIVITY & UPDATE LOG</h2>
                                    <button onClick={() => setShowActivityLog(false)} className="text-slate-400 hover:text-slate-200 font-bold px-2 text-lg cursor-pointer">✕</button>
                                </div>
                                <div className="p-4 overflow-y-auto flex-1 space-y-3">
                                    {notifications.map(n => (
                                        <div key={n.id} onClick={() => jumpToPatient(n.patientId)} className={`p-3 rounded-lg border text-sm transition ${n.patientId ? (isDark ? 'bg-slate-800 border-slate-700 hover:border-blue-500 cursor-pointer' : 'bg-white border-slate-200 hover:border-blue-400 hover:shadow-md cursor-pointer') : (isDark ? 'bg-slate-900 border-slate-800 text-slate-400' : 'bg-slate-50 border-slate-100 text-slate-500')}`}>
                                            <div className="text-xs text-slate-400 font-bold mb-1">{n.time}</div>
                                            <div className={`font-medium ${isDark ? 'text-slate-300' : 'text-slate-700'}`}>{n.text}</div>
                                            {n.patientId && <div className="text-xs text-blue-500 font-bold mt-2 flex items-center gap-1">JUMP TO PATIENT ➔</div>}
                                        </div>
                                    ))}
                                    {notifications.length === 0 && <div className="text-center text-slate-400 text-sm py-4">No recent activity.</div>}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
